pacity="1"><path d="M 720 1082 V 1134 H 968 V 1548 H 540 V 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-zh-flow)"></path><rect x="826" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="910" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="910" y="1345">完整版本就緒</tspan></text></g><g opacity="1"><path d="M 720 1082 C 720 1131, 540 1131, 540 1180" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-zh-stop)"></path><rect x="546" y="1109" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="1127">Transaction</tspan><tspan x="630" y="1143">已回滾</tspan></text></g><g opacity="1"><path d="M 540 1292 C 540 1341, 540 1341, 540 1390" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#n8n_daily-zh-fallback)"></path><rect x="456" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="540" y="1345">保留舊完整批次</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#n8n_daily-zh-fallback)"></path><rect x="456" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="540" y="1555">原年齡＋失敗狀態</tspan></text></g><g data-node-id="schedule" aria-label="n8n SCHEDULE + TIMEZONE"><title>n8n SCHEDULE + TIMEZONE · 獨立每日工作，不需要用戶提示。</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">n8n SCHEDULE + TIMEZONE</tspan></text></g><g data-node-id="claim" aria-label="n8n CLAIM BATCH KEY"><title>n8n CLAIM BATCH KEY · 原子取得來源＋排程期間＋設定版本批次鍵；已有執行先核對，不重複。</title><polygon points="540,340 680,396 540,452 400,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">n8n CLAIM BATCH KEY</tspan></text></g><g data-node-id="pending" aria-label="IN PROGRESS → END"><title>IN PROGRESS → END · 回傳原執行狀態，不另開供應商嘗試或發布未完整批次。</title><rect x="220" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="610">IN PROGRESS → END</tspan></text></g><g data-node-id="fetch" aria-label="n8n APPROVED API / RSS"><title>n8n APPROVED API / RSS · 宏觀／地緣供應商與只抓公司的 YFinance 端點分開；工作時限內最多 3 次暫時錯誤嘗試。</title><polygon points="720,550 860,606 720,662 580,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">n8n APPROVED API / RSS</tspan></text></g><g data-node-id="retry" aria-label="n8n RETRY DECISION"><title>n8n RETRY DECISION · 只重試暫時錯誤，3 次或工作時限即停；格式／認證錯誤不重試。</title><polygon points="360,760 500,816 360,872 220,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="820">n8n RETRY DECISION</tspan></text></g><g data-node-id="normalize" aria-label="VALIDATE + DEDUPLICATE"><title>VALIDATE + DEDUPLICATE · 正規化來源、日期、主題、地域及版本 hash；隔離無效記錄，不發布未完整批次。</title><polygon points="720,760 860,816 720,872 580,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">VALIDATE + DEDUPLICATE</tspan></text></g><g data-node-id="wait" aria-label="n8n BACKOFF + JITTER"><title>n8n BACKOFF + JITTER · 等待 1 秒、2 秒加 jitter，遵守 Retry-After 並限制於工作餘額。</title><rect x="220" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1030">n8n BACKOFF + JITTER</tspan></text></g><g data-node-id="commit" aria-label="COMMIT COMPLETE BATCH"><title>COMMIT COMPLETE BATCH · 證據版本及批次完成狀態原子提交，之後才可入快照。</title><polygon points="720,970 860,1026 720,1082 580,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1030">COMMIT COMPLETE BATCH</tspan></text></g><g data-node-id="failure" aria-label="RECORD FAILED JOB"><title>RECORD FAILED JOB · 保存失敗及執行 ID；未提交或部分批次不能當合資格證據。</title><rect x="400" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1240">RECORD FAILED JOB</tspan></text></g><g data-node-id="prior" aria-label="RETAIN PRIOR COMPLETED BATCH"><title>RETAIN PRIOR COMPLETED BATCH · 保留原 fetched_at 及失敗／過期狀態，不能聲稱今日成功抓取。</title><rect x="400" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">RETAIN PRIOR COMPLETED BATCH</tspan></text></g><g data-node-id="pool" aria-label="POSTGRESQL EVIDENCE POOL"><title>POSTGRESQL EVIDENCE POOL · 之後有效請求固定合資格版本，再按問題重查新鮮度；每日工作不生成報告。</title><rect x="400" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">POSTGRESQL EVIDENCE POOL</tspan></text></g><text x="36" y="1758" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
