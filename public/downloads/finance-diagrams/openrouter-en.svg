<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1780" width="1800" height="1780" role="img" aria-label="Every generative call uses one OpenRouter boundary" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Every generative call uses one OpenRouter boundary</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="openrouter-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="openrouter-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="openrouter-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="openrouter-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="openrouter-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1800" height="1780" fill="#fcfcf8"></rect><rect width="1800" height="1780" fill="url(#openrouter-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · OPENROUTER · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Every generative call uses one OpenRouter boundary</text><g opacity="1"><path d="M 900 242 C 900 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="546" y="269" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="287">Every accepted API</tspan><tspan x="630" y="303">request is screened</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="726" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="295">Gap and budget only</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1080 291, 1080 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="906" y="269" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="990" y="287">Evidence sufficient</tspan><tspan x="990" y="303">only</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 900 501, 900 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="546" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="505">Role: scope</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 900 501, 900 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="726" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="505">Role: refine</tspan></text></g><g opacity="1"><path d="M 1080 452 C 1080 501, 900 501, 900 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="906" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="990" y="505">Role: report</tspan></text></g><g opacity="1"><path d="M 900 662 C 900 711, 900 711, 900 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="816" y="689" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="707">Persisted permit + time</tspan><tspan x="900" y="723">left</tspan></text></g><g opacity="1"><path d="M 900 662 V 700 H 1760 V 1562 H 1080 V 1600" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#openrouter-en-stop)"></path><rect x="1618" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1702" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1702" y="1135">Already spent / expired</tspan></text></g><g opacity="1"><path d="M 900 872 C 900 921, 900 921, 900 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="816" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="925">Strict JSON request</tspan></text></g><g opacity="1"><path d="M 900 1082 C 900 1131, 900 1131, 900 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="816" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="1135">Explicit route</tspan></text></g><g opacity="1"><path d="M 900 1292 C 900 1341, 900 1341, 900 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="816" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="1345">Buffered response</tspan></text></g><g opacity="1"><path d="M 900 1502 C 900 1551, 720 1551, 720 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="726" y="1529" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="1547">All boundary checks</tspan><tspan x="810" y="1563">pass</tspan></text></g><g opacity="1"><path d="M 900 872 V 896 H 1736 V 1576 H 1080 V 1600" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#openrouter-en-stop)"></path><rect x="1594" y="1214" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1678" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1678" y="1232">Privacy / transport</tspan><tspan x="1678" y="1248">failure</tspan></text></g><g opacity="1"><path d="M 900 1502 C 900 1551, 1080 1551, 1080 1600" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#openrouter-en-stop)"></path><rect x="906" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="990" y="1555">Invalid output</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1440 291, 1440 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-en-flow)"></path><rect x="1086" y="269" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1170" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1170" y="287">Separate model/tool</tspan><tspan x="1170" y="303">budgets</tspan></text></g><g data-node-id="sites" aria-label="LANGGRAPH CALL SITES · MAX 3"><title>LANGGRAPH CALL SITES · MAX 3 · Call-site routing map, not parallel execution. Scope precedes news; refinement is conditional; report follows evidence checks.</title><polygon points="900,130 1040,186 900,242 760,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="180">LANGGRAPH CALL SITES ·</tspan><tspan x="900" y="200">MAX 3</tspan></text></g><g data-node-id="scope" aria-label="SCOPE · OPENROUTER · MAX 1"><title>SCOPE · OPENROUTER · MAX 1 · Sanitized company research request → constrained scope schema. API failure stops before news.</title><rect x="220" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="400">SCOPE · OPENROUTER · MAX 1</tspan></text></g><g data-node-id="refine" aria-label="REFINE · OPENROUTER · MAX 1"><title>REFINE · OPENROUTER · MAX 1 · Missing facets → one query without changing company, snapshot or budgets.</title><rect x="580" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">REFINE · OPENROUTER · MAX 1</tspan></text></g><g data-node-id="report" aria-label="REPORT · OPENROUTER · MAX 1"><title>REPORT · OPENROUTER · MAX 1 · Gate-approved excerpts → a cited conditional draft, not a guaranteed prediction.</title><rect x="940" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="400">REPORT · OPENROUTER · MAX 1</tspan></text></g><g data-node-id="separate" aria-label="NEWS / E5 / BGE / POSTGRESQL"><title>NEWS / E5 / BGE / POSTGRESQL · Separate deterministic ingestion, local model and database paths. These are not Chat Completions calls.</title><rect x="1300" y="340" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1440" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1440" y="400">NEWS / E5 / BGE / POSTGRESQL</tspan></text></g><g data-node-id="reserve" aria-label="DURABLE CALL RESERVATION"><title>DURABLE CALL RESERVATION · Host atomically spends an attempt and freezes its configuration before dispatch. No budget reset on resume.</title><polygon points="900,550 1040,606 900,662 760,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="600">DURABLE CALL</tspan><tspan x="900" y="620">RESERVATION</tspan></text></g><g data-node-id="gateway" aria-label="SHARED PYTHON GATEWAY"><title>SHARED PYTHON GATEWAY · Sanitize, enforce schema/tokens/deadline, buffer responses, no retries or raw streaming.</title><polygon points="900,760 1040,816 900,872 760,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="820">SHARED PYTHON GATEWAY</tspan></text></g><g data-node-id="router" aria-label="OPENROUTER CHAT COMPLETIONS"><title>OPENROUTER CHAT COMPLETIONS · One server-only key; explicit model and approved provider endpoint. No automatic model/provider fallback.</title><rect x="760" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1030">OPENROUTER CHAT COMPLETIONS</tspan></text></g><g data-node-id="provider" aria-label="APPROVED MODEL PROVIDER"><title>APPROVED MODEL PROVIDER · Use a schema-capable endpoint with reviewed data policy. Observe served identities instead of assuming immutable weights.</title><rect x="760" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1240">APPROVED MODEL PROVIDER</tspan></text></g><g data-node-id="validate" aria-label="SANITIZE + PARSE + VALIDATE"><title>SANITIZE + PARSE + VALIDATE · Reject truncation/refusal/tool calls/invalid schema/unknown citations. Full factual-support checks still follow.</title><polygon points="900,1390 1040,1446 900,1502 760,1446" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1440">SANITIZE + PARSE +</tspan><tspan x="900" y="1460">VALIDATE</tspan></text></g><g data-node-id="state" aria-label="SAFE STATE + OTel METADATA"><title>SAFE STATE + OTel METADATA · Return sanitized state only and export safe usage to Langfuse/LangSmith via the existing Collector.</title><rect x="580" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1660">SAFE STATE + OTel METADATA</tspan></text></g><g data-node-id="stop" aria-label="UNAVAILABLE / PRIVACY BLOCKED"><title>UNAVAILABLE / PRIVACY BLOCKED · Typed safe error, attempt remains spent. Never return provider body, secret or unvalidated draft.</title><rect x="940" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="1660">UNAVAILABLE / PRIVACY BLOCKED</tspan></text></g><text x="36" y="1758" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
