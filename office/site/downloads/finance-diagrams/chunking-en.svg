<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1990" width="1080" height="1990" role="img" aria-label="From n8n news to searchable passages" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>From n8n news to searchable passages</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="chunking-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="chunking-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="chunking-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="chunking-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="chunking-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="1990" fill="#fcfcf8"></rect><rect width="1080" height="1990" fill="url(#chunking-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · CHUNKING · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">From n8n news to searchable passages</text><g opacity="1"><path d="M 540 242 C 540 291, 540 291, 540 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">One version per article</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="505">New version queued</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 360 711, 360 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="366" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="715">Content or summary</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 720 711, 720 760" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#chunking-en-stop)"></path><rect x="546" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="715">No usable text</tspan></text></g><g opacity="1"><path d="M 360 872 C 360 921, 540 921, 540 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="366" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="925">Exact text slices</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 540 1131, 540 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1135">After chunk creation</tspan></text></g><g opacity="1"><path d="M 540 1292 C 540 1341, 540 1341, 540 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="1319" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1337">All expected vectors</tspan><tspan x="540" y="1353">valid</tspan></text></g><g opacity="1"><path d="M 540 1082 V 1120 H 1040 V 1562 H 540 V 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="898" y="1319" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="982" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="982" y="1337">Sparse search uses</tspan><tspan x="982" y="1353">admitted text</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1555">Admitted hybrid only</tspan></text></g><g opacity="1"><path d="M 540 1712 C 540 1761, 540 1761, 540 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="1739" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1757">Eligible versions and</tspan><tspan x="540" y="1773">cutoff</tspan></text></g><g data-node-id="payload" aria-label="n8n NEWS ARRAY"><title>n8n NEWS ARRAY · The company flow requests up to three YFinance articles. Treat each item as a separate document.</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">n8n NEWS ARRAY</tspan></text></g><g data-node-id="commit" aria-label="VALIDATE, SANITIZE, COMMIT"><title>VALIDATE, SANITIZE, COMMIT · Deduplicate and store immutable versions in news_ingest.versions. The receipt returns committed version IDs.</title><rect x="400" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">VALIDATE, SANITIZE, COMMIT</tspan></text></g><g data-node-id="outbox" aria-label="READ COMMITTED VERSION"><title>READ COMMITTED VERSION · The proposed indexing worker follows a pending embedding_outbox entry to the sanitized source field.</title><polygon points="540,550 680,606 540,662 400,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="610">READ COMMITTED VERSION</tspan></text></g><g data-node-id="split" aria-label="TOKENIZE AND SPLIT"><title>TOKENIZE AND SPLIT · Keep each chunk within one article. Prefer paragraphs or sentences near the target and validate the full model input.</title><rect x="220" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="820">TOKENIZE AND SPLIT</tspan></text></g><g data-node-id="empty" aria-label="RECORD MISSING TEXT"><title>RECORD MISSING TEXT · If both content and summary are blank, record the gap and skip encoding.</title><rect x="580" y="760" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">RECORD MISSING TEXT</tspan></text></g><g data-node-id="metadata" aria-label="WRITE CHUNK METADATA"><title>WRITE CHUNK METADATA · Persist the version, source field, exact offsets, chunk order, policy, hash and token count.</title><polygon points="540,970 680,1026 540,1082 400,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1030">WRITE CHUNK METADATA</tspan></text></g><g data-node-id="embed" aria-label="ENCODE E5 PASSAGE"><title>ENCODE E5 PASSAGE · A pinned local model encodes the passage. Validate the input including prefix and special tokens.</title><rect x="400" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1240">ENCODE E5 PASSAGE</tspan></text></g><g data-node-id="ready" aria-label="STORE READY VECTORS"><title>STORE READY VECTORS · Use idempotent writes keyed by chunk and embedding configuration. Mark the outbox complete only after all expected rows commit.</title><rect x="400" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">STORE READY VECTORS</tspan></text></g><g data-node-id="snapshot" aria-label="PIN RETRIEVAL SNAPSHOT"><title>PIN RETRIEVAL SNAPSHOT · The report host admits eligible versions and pins the configuration and ready vector set. Sparse remains the default until evaluated hybrid admission.</title><rect x="400" y="1600" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">PIN RETRIEVAL SNAPSHOT</tspan></text></g><g data-node-id="retrieve" aria-label="SEARCH, RERANK, CITE"><title>SEARCH, RERANK, CITE · Retrieve permitted passages within the cutoff. Apply reranking in admitted hybrid, group overlapping hits, recheck evidence and cite the dated source.</title><rect x="400" y="1810" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1870">SEARCH, RERANK, CITE</tspan></text></g><text x="36" y="1968" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
