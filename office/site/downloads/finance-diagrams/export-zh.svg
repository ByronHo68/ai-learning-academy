<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 730" width="1080" height="730" role="img" aria-label="保存及下載報告" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>保存及下載報告</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="export-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="export-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="export-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="export-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="export-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="730" fill="#fcfcf8"></rect><rect width="1080" height="730" fill="url(#export-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · EXPORT · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">保存及下載報告</text><g opacity="1"><path d="M 540 242 C 540 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#export-zh-flow)"></path><rect x="366" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="295">有權限</tspan></text></g><g opacity="1"><path d="M 540 242 C 540 291, 720 291, 720 340" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#export-zh-stop)"></path><rect x="546" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="295">不能匯出</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#export-zh-flow)"></path><rect x="366" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="505">不再呼叫 LLM</tspan></text></g><g data-node-id="Report ID → authorized lookup" aria-label="Report ID → authorized lookup"><title>Report ID → authorized lookup · 保存已核對結果，下載內容與畫面一致。</title><polygon points="540,130 680,186 540,242 400,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="180">Report ID → authorized</tspan><tspan x="540" y="200">lookup</tspan></text></g><g data-node-id="Saved result" aria-label="Saved result"><title>Saved result · 保存已核對結果，下載內容與畫面一致。</title><rect x="220" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="400">Saved result</tspan></text></g><g data-node-id="404 / conflict → END" aria-label="404 / conflict → END"><title>404 / conflict → END · 保存已核對結果，下載內容與畫面一致。</title><rect x="580" y="340" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">404 / conflict → END</tspan></text></g><g data-node-id="Serialize → download" aria-label="Serialize → download"><title>Serialize → download · 保存已核對結果，下載內容與畫面一致。</title><rect x="400" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="610">Serialize → download</tspan></text></g><text x="36" y="708" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
