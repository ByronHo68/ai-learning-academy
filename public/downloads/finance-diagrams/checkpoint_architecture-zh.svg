<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1780" width="900" height="1780" role="img" aria-label="AsyncPostgresSaver 在項目的位置" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>AsyncPostgresSaver 在項目的位置</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="checkpoint_architecture-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="checkpoint_architecture-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="checkpoint_architecture-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="checkpoint_architecture-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="checkpoint_architecture-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="900" height="1780" fill="#fcfcf8"></rect><rect width="900" height="1780" fill="url(#checkpoint_architecture-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · CHECKPOINT_ARCHITECTURE · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">AsyncPostgresSaver 在項目的位置</text><g opacity="1"><path d="M 450 242 C 450 291, 450 291, 450 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-zh-flow)"></path><rect x="366" y="269" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-a