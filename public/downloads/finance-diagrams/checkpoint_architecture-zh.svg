eight="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="802" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="802" y="925">初始狀態／step 邊界</tspan></text></g><g opacity="1"><path d="M 450 662 V 686 H 836 V 1366 H 450 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-zh-flow)"></path><rect x="694" y="1012" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="778" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="778" y="1030">收據引用</tspan></text></g><g opacity="1"><path d="M 450 872 V 910 H 812 V 1352 H 450 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-zh-flow)"></path><rect x="670" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="754" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="754" y="1135">快照＋ID＋次數</tspan></text></g><g opacity="1"><path d="M 450 1082 V 1134 H 788 V 1338 H 450 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-zh-flow)"></path><rect x="646" y="1222" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="730" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="730" y="1240">等待中斷＋狀態</tspan></text></g><g opacity="1"><path d="M 450 1292 C 450 1341, 450 1341, 450 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-zh-flow)"></path><rect x="366" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1345">報告引用＋狀態</tspan></text></g><g opacity="1"><path d="M 450 1502 C 450 1551, 450 1551, 450 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-zh-flow)"></path><rect x="366" y="1529" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1547">Async I/O</tspan><tspan x="450" y="1563">保存／載入</tspan></text></g><g data-node-id="api" aria-label="PYTHON API + OWNER / RUN"><title>PYTHON API + OWNER / RUN · 每次開始、查看或恢復前驗證身分，解析伺服器建立的 thread。</title><rect x="310" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="190">PYTHON API + OWNER / RUN</tspan></text></g><g data-node-id="graph" aria-label="LANGGRAPH RESEARCH GRAPH"><title>LANGGRAPH RESEARCH GRAPH · 執行節點及條件路徑；app 生命週期內以 checkpointer=saver 編譯。</title><polygon points="450,340 590,396 450,452 310,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="390">LANGGRAPH RESEARCH</tspan><tspan x="450" y="410">GRAPH</tspan></text></g><g data-node-id="n8n" aria-label="HOST refresh: n8n RECEIPT"><title>HOST refresh: n8n RECEIPT · LangGraph refresh 節點呼叫 n8n，並 checkpoint 回傳收據引用。n8n 管抓取重試及收據核對，每日 Alpha Vantage 工作獨立執行。</title><polygon points="450,550 590,606 450,662 310,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="600">HOST refresh: n8n</tspan><tspan x="450" y="620">RECEIPT</tspan></text></g><g data-node-id="rank" aria-label="SNAPSHOT → SEARCH → RANK"><title>SNAPSHOT → SEARCH → RANK · 用固定證據及檢索視圖，保存排序來源 ID 及搜尋次數。</title><polygon points="450,760 590,816 450,872 310,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="810">SNAPSHOT → SEARCH →</tspan><tspan x="450" y="830">RANK</tspan></text></g><g data-node-id="review" aria-label="REVIEW interrupt()"><title>REVIEW interrupt() · 暫停等來源排除／次序選擇；完成抓取放在中斷節點外。</title><polygon points="450,970 590,1026 450,1082 310,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="1030">REVIEW interrupt()</tspan></text></g><g data-node-id="report" aria-label="EVIDENCE GATE → LLM → REPORT"><title>EVIDENCE GATE → LLM → REPORT · 查證據及預算，再驗證及把結果存業務資料庫。</title><rect x="310" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="1240">EVIDENCE GATE → LLM → REPORT</tspan></text></g><g data-node-id="saver" aria-label="AsyncPostgresSaver"><title>AsyncPostgresSaver · 框架持久保存介面，在 checkpoint 邊界存 graph 狀態；async I/O 與 durability 模式不同。</title><rect x="310" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="1450">AsyncPostgresSaver</tspan></text></g><g data-node-id="checkpoint_db" aria-label="POSTGRESQL research_checkpoints"><title>POSTGRESQL research_checkpoints · 套件管理的表存 thread 進度，不取代新聞、報告或 n8n 管理資料。</title><rect x="310" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="1650">POSTGRESQL</tspan><tspan x="450" y="1670">research_checkpoints</tspan></text></g><text x="36" y="1758" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
