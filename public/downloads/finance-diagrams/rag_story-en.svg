<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2830" width="1080" height="2830" role="img" aria-label="Stock research RAG from news to citation" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Stock research RAG from news to citation</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="rag_story-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="rag_story-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="rag_story-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="rag_story-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="rag_story-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="2830" fill="#fcfcf8"></rect><rect width="1080" height="2830" fill="url(#rag_story-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · RAG_STORY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Stock research RAG from news to citation</text><g opacity="1"><path d="M 540 242 C 540 291, 540 291, 540 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">Validated n8n receipt</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="505">Admitted source</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 540 711, 540 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="715">Sanitized excerpts</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 540 921, 540 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="925">Embedding response</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 540 1131, 540 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1135">Model, indexes, vectors</tspan></text></g><g opacity="1"><path d="M 540 1292 C 540 1341, 540 1341, 540 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1345">All vectors validated</tspan></text></g><g opacity="1"><path d="M 540 1292 V 1316 H 1040 V 1576 H 540 V 1600" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#rag_story-en-fallback)"></path><rect x="898" y="1424" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="982" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="982" y="1442">Invalid batch →</tspan><tspan x="982" y="1458">full-text</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="1529" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1547">Pin compatible ready</tspan><tspan x="540" y="1563">vectors</tspan></text></g><g opacity="1"><path d="M 540 1712 C 540 1761, 540 1761, 540 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="1739" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1757">Scope, cutoff and</tspan><tspan x="540" y="1773">allowed IDs</tspan></text></g><g opacity="1"><path d="M 540 1922 C 540 1971, 540 1971, 540 2020" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="1957" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1975">Admitted hybrid</tspan></text></g><g opacity="1"><path d="M 540 1922 V 1960 H 1016 V 2192 H 540 V 2230" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="874" y="2062" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="958" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="958" y="2080">Default full-text</tspan></text></g><g opacity="1"><path d="M 540 2132 C 540 2181, 540 2181, 540 2230" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="456" y="2167" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="2185">Ranked passages</tspan></text></g><g opacity="1"><path d="M 540 2342 C 540 2391, 360 2391, 360 2440" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="366" y="2377" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="2395">Enough evidence</tspan></text></g><g opacity="1"><path d="M 540 2342 C 540 2391, 720 2391, 720 2440" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#rag_story-en-stop)"></path><rect x="546" y="2369" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="2387">Missing support after</tspan><tspan x="630" y="2403">checks</tspan></text></g><g opacity="1"><path d="M 360 2552 C 360 2601, 540 2601, 540 2650" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-en-flow)"></path><rect x="366" y="2587" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="2605">Draft and citations</tspan></text></g><g data-node-id="fetch" aria-label="FETCH"><title>FETCH · n8n asks the configured tool for up to three company articles. The story follows one item from the news array. Daily macro news and curated profiles can supply other eligible evidence.</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">FETCH</tspan></text></g><g data-node-id="admit" aria-label="ADMIT"><title>ADMIT · n8n validates, sanitizes, deduplicates and commits the batch. The app admits eligible versions after checking rights, dates and source scope. The app owns the article ID, URL, timestamps and policy.</title><rect x="400" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">ADMIT</tspan></text></g><g data-node-id="chunk" aria-label="CHUNK"><title>CHUNK · Use the pinned chunking policy. This short example has two passages to make the batch easy to inspect. Save each chunk ID, source ID, offsets and text under stock_rag.chunks.</title><rect x="400" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="610">CHUNK</tspan></text></g><g data-node-id="request" aria-label="SEND TEXT"><title>SEND TEXT · POST /embeddings from a server-side worker with an approved model and provider. The input array contains permitted excerpts. The worker keeps a local list of chunk IDs in that same order.</title><rect x="400" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="820">SEND TEXT</tspan></text></g><g data-node-id="response" aria-label="READ VECTORS"><title>READ VECTORS · OpenRouter returns the model and a data array. Each item has index and embedding. The example reverses the item order so you can see why the index matters. Your citation metadata lives in your database.</title><rect x="400" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1030">READ VECTORS</tspan></text></g><g data-node-id="join" aria-label="JOIN"><title>JOIN · Check the returned model, finite vector values, dimension, and exactly one result for each input index. Use inputChunkIds[index] to attach the vector. Reject an invalid batch before writing any vector.</title><polygon points="540,1180 680,1236 540,1292 400,1236" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1240">JOIN</tspan></text></g><g data-node-id="store" aria-label="STORE"><title>STORE · Save each validated vector by chunk ID and model configuration in a compatible pgvector table. The source and chunk tables keep the title, date, URL and excerpt. Reuse exact matching vectors on replay.</title><rect x="400" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">STORE</tspan></text></g><g data-node-id="snapshot" aria-label="FREEZE"><title>FREEZE · LangGraph checks scope and calls the required n8n refresh. It freezes eligible chunk IDs, the as-of cutoff and ready vectors for this run. Search and any refinement reuse that snapshot.</title><rect x="400" y="1600" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">FREEZE</tspan></text></g><g data-node-id="retrieve" aria-label="RETRIEVE"><title>RETRIEVE · Full-text search is the project default. In admitted hybrid mode, encode the question with the same compatible model and settings, search pgvector under snapshot filters, and combine dense and full-text candidates.</title><polygon points="540,1810 680,1866 540,1922 400,1866" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1870">RETRIEVE</tspan></text></g><g data-node-id="rerank" aria-label="RERANK"><title>RERANK · A reranker compares the question with each candidate’s text. The passage about spending and margins goes ahead of the capacity announcement for this question. The order represents relevance.</title><rect x="400" y="2020" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="2080">RERANK</tspan></text></g><g data-node-id="review" aria-label="REVIEW"><title>REVIEW · In review mode the user can highlight, remove or reorder candidates. Check that selected IDs are in the snapshot, then recheck coverage after exclusions and context trimming.</title><polygon points="540,2230 680,2286 540,2342 400,2286" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="2290">REVIEW</tspan></text></g><g data-node-id="generate" aria-label="GENERATE"><title>GENERATE · Augment the prompt with selected excerpts and citation IDs. Call the separate OpenRouter chat endpoint to draft the report. The generation model gets the evidence text and citation references.</title><rect x="220" y="2440" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="2500">GENERATE</tspan></text></g><g data-node-id="gap" aria-label="INSUFFICIENT EVIDENCE"><title>INSUFFICIENT EVIDENCE · The remaining source covers capacity only. Explain the missing support and stop before report generation.</title><rect x="580" y="2440" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="2500">INSUFFICIENT EVIDENCE</tspan></text></g><g data-node-id="validate" aria-label="VALIDATE"><title>VALIDATE · Check that each material claim is supported by its cited excerpt and that all IDs belong to the snapshot. Return an explicit evidence gap when support is missing.</title><rect x="400" y="2650" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="2710">VALIDATE</tspan></text></g><text x="36" y="2808" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
