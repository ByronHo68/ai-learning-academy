<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1780" width="1800" height="1780" role="img" aria-label="每次生成呼叫共用 OpenRouter 邊界" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>每次生成呼叫共用 OpenRouter 邊界</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="openrouter-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="openrouter-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="openrouter-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="openrouter-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="openrouter-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1800" height="1780" fill="#fcfcf8"></rect><rect width="1800" height="1780" fill="url(#openrouter-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · OPENROUTER · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">每次生成呼叫共用 OpenRouter 邊界</text><g opacity="1"><path d="M 900 242 C 900 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="546" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="295">每 API 請求先篩選</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="726" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="295">只限缺口及餘額</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1080 291, 1080 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="906" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="990" y="295">只限證據足夠</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 900 501, 900 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="546" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="505">角色 scope</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 900 501, 900 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="726" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="505">角色 refine</tspan></text></g><g opacity="1"><path d="M 1080 452 C 1080 501, 900 501, 900 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="906" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="990" y="505">角色 report</tspan></text></g><g opacity="1"><path d="M 900 662 C 900 711, 900 711, 900 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="816" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="715">已存預留＋剩餘時間</tspan></text></g><g opacity="1"><path d="M 900 662 V 700 H 1760 V 1562 H 1080 V 1600" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#openrouter-zh-stop)"></path><rect x="1618" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1702" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1702" y="1135">已用／過期</tspan></text></g><g opacity="1"><path d="M 900 872 C 900 921, 900 921, 900 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="816" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="925">嚴格 JSON 請求</tspan></text></g><g opacity="1"><path d="M 900 1082 C 900 1131, 900 1131, 900 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="816" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="1135">明確路由</tspan></text></g><g opacity="1"><path d="M 900 1292 C 900 1341, 900 1341, 900 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="816" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="1345">緩衝回應</tspan></text></g><g opacity="1"><path d="M 900 1502 C 900 1551, 720 1551, 720 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="726" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="1555">全部邊界檢查通過</tspan></text></g><g opacity="1"><path d="M 900 872 V 896 H 1736 V 1576 H 1080 V 1600" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#openrouter-zh-stop)"></path><rect x="1594" y="1222" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1678" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1678" y="1240">隱私／傳送失敗</tspan></text></g><g opacity="1"><path d="M 900 1502 C 900 1551, 1080 1551, 1080 1600" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#openrouter-zh-stop)"></path><rect x="906" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="990" y="1555">無效輸出</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1440 291, 1440 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#openrouter-zh-flow)"></path><rect x="1086" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1170" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1170" y="295">獨立模型／工具預算</tspan></text></g><g data-node-id="sites" aria-label="LANGGRAPH CALL SITES · MAX 3"><title>LANGGRAPH CALL SITES · MAX 3 · 這是呼叫位置路由圖，不代表並行。Scope 先於新聞，補查有條件，報告在證據檢查之後。</title><polygon points="900,130 1040,186 900,242 760,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="180">LANGGRAPH CALL SITES ·</tspan><tspan x="900" y="200">MAX 3</tspan></text></g><g data-node-id="scope" aria-label="SCOPE · OPENROUTER · MAX 1"><title>SCOPE · OPENROUTER · MAX 1 · 清理公司研究請求 → 受限 scope schema，API 失敗在新聞前停止。</title><rect x="220" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="400">SCOPE · OPENROUTER · MAX 1</tspan></text></g><g data-node-id="refine" aria-label="REFINE · OPENROUTER · MAX 1"><title>REFINE · OPENROUTER · MAX 1 · 缺少面向 → 一條查詢，不改公司、快照或預算。</title><rect x="580" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">REFINE · OPENROUTER · MAX 1</tspan></text></g><g data-node-id="report" aria-label="REPORT · OPENROUTER · MAX 1"><title>REPORT · OPENROUTER · MAX 1 · 關卡核准節錄 → 有引用條件草稿，不是保證預測。</title><rect x="940" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="400">REPORT · OPENROUTER · MAX 1</tspan></text></g><g data-node-id="separate" aria-label="NEWS / E5 / BGE / POSTGRESQL"><title>NEWS / E5 / BGE / POSTGRESQL · 獨立固定匯入、本機模型及資料庫路徑，不是 Chat Completions 呼叫。</title><rect x="1300" y="340" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1440" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1440" y="400">NEWS / E5 / BGE / POSTGRESQL</tspan></text></g><g data-node-id="reserve" aria-label="DURABLE CALL RESERVATION"><title>DURABLE CALL RESERVATION · Host 發出前原子花費嘗試及固定設定，恢復不重設預算。</title><polygon points="900,550 1040,606 900,662 760,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="600">DURABLE CALL</tspan><tspan x="900" y="620">RESERVATION</tspan></text></g><g data-node-id="gateway" aria-label="SHARED PYTHON GATEWAY"><title>SHARED PYTHON GATEWAY · 清理、限制 schema／token／時限，緩衝回應，不重試或原串流。</title><polygon points="900,760 1040,816 900,872 760,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="820">SHARED PYTHON GATEWAY</tspan></text></g><g data-node-id="router" aria-label="OPENROUTER CHAT COMPLETIONS"><title>OPENROUTER CHAT COMPLETIONS · 一條伺服器金鑰，確切模型及核准 provider endpoint，不自動模型／provider 回退。</title><rect x="760" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1030">OPENROUTER CHAT COMPLETIONS</tspan></text></g><g data-node-id="provider" aria-label="APPROVED MODEL PROVIDER"><title>APPROVED MODEL PROVIDER · 用支援 schema 且已覆核資料政策的 endpoint，記實際身份，不假設不可變權重。</title><rect x="760" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1240">APPROVED MODEL PROVIDER</tspan></text></g><g data-node-id="validate" aria-label="SANITIZE + PARSE + VALIDATE"><title>SANITIZE + PARSE + VALIDATE · 拒絕截斷／拒答／tool call／無效 schema／未知引用，之後仍須完整事實支持檢查。</title><polygon points="900,1390 1040,1446 900,1502 760,1446" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1440">SANITIZE + PARSE +</tspan><tspan x="900" y="1460">VALIDATE</tspan></text></g><g data-node-id="state" aria-label="SAFE STATE + OTel METADATA"><title>SAFE STATE + OTel METADATA · 只回清理 state，安全用量經既有 Collector 送 Langfuse／LangSmith。</title><rect x="580" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1660">SAFE STATE + OTel METADATA</tspan></text></g><g data-node-id="stop" aria-label="UNAVAILABLE / PRIVACY BLOCKED"><title>UNAVAILABLE / PRIVACY BLOCKED · 安全結構化錯誤，嘗試仍計數，不回供應商 body、秘密或未驗證草稿。</title><rect x="940" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="1660">UNAVAILABLE / PRIVACY BLOCKED</tspan></text></g><text x="36" y="1758" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
