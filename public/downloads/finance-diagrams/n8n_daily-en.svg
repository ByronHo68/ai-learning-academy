<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1990" width="1080" height="1990" role="img" aria-label="n8n daily Alpha Vantage news" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>n8n daily Alpha Vantage news</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="n8n_daily-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="n8n_daily-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="n8n_daily-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="n8n_daily-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="n8n_daily-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="1990" fill="#fcfcf8"></rect><rect width="1080" height="1990" fill="url(#n8n_daily-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · N8N_DAILY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">n8n daily Alpha Vantage news</text><g opacity="1"><path d="M 540 242 C 540 291, 540 291, 540 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-en-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">Daily trigger</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 720 501, 720 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-en-flow)"></path><rect x="546" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="505">New batch lease</tspan></text></g><g opacity="1"><path d="M 720 662 C 720 711, 540 711, 540 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-en-flow)"></path><rect x="546" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="715">Budgeted query windows</tspan></text></g><g opacity="1"><path d="M 540 452 V 476 H 1040 V 1786 H 540 V 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-en-flow)"></path><rect x="898" y="1109" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="982" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="982" y="1127">Existing completed</tspan><tspan x="982" y="1143">batch</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 360 501, 360 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-en-stop)"></path><rect x="366" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="450" y="497">Existing running</tspan><tspan x="450" y="513">execution</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 720 921, 720 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-en-flow)"></path><rect x="546" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="925">Response received</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 360 921, 360 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-en-flow)"></path><rect x="366" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="925">Provider error</tspan></text></g><g opacity="1"><path d="M 360 1082 C 360 1131, 360 1131, 360 1180" fill="none" stroke="#7251a1" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#n8n_daily-en-retry)"></path><rect x="276" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#7251a1" stroke-opacity=".23"></rect><text x="360" text-anchor="middle" fill="#7251a1" font-size="12" font-weight="600"><tspan x="360" y="1135">Transient + time left</tspan></text></g><g opacity="1"><path d="M 220 1236 H 65 V 816 H 400" fill="none" stroke="#7251a1" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#n8n_daily-en-retry)"></path><rect x="16" y="1004" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#7251a1" stroke-opacity=".23"></rect><text x="100" text-anchor="middle" fill="#7251a1" font-size="12" font-weight="600"><tspan x="100" y="1022">Same batch; next</tspan><tspan x="100" y="1038">attempt</tspan></text></g><g opacity="1"><path d="M 360 1082 V 1106 H 1016 V 1366 H 540 V 1390" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-en-stop)"></path><rect x="874" y="1222" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="958" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="958" y="1240">Permanent / exhausted</tspan></text></g><g opacity="1"><path d="M 720 1082 C 720 1131, 720 1131, 720 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-en-flow)"></path><rect x="636" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="1135">Valid batch</tspan></text></g><g opacity="1"><path d="M 720 1082 V 1134 H 992 V 1338 H 540 V 1390" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-en-stop)"></path><rect x="850" y="1222" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="934" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="934" y="1240">Invalid / incomplete</tspan></text></g><g opacity="1"><path d="M 720 1292 V 1316 H 968 V 1786 H 540 V 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-en-flow)"></path><rect x="826" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="910" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="910" y="1555">Complete versions ready</tspan></text></g><g opacity="1"><path d="M 720 1292 C 720 1341, 540 1341, 540 1390" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-en-stop)"></path><rect x="546" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="1345">Transaction rolled back</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#n8n_daily-en-fallback)"></path><rect x="456" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="540" y="1555">Preserve prior batch</tspan></text></g><g opacity="1"><path d="M 540 1712 C 540 1761, 540 1761, 540 1810" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#n8n_daily-en-fallback)"></path><rect x="456" y="1739" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="540" y="1757">Original age + failure</tspan><tspan x="540" y="1773">status</tspan></text></g><g data-node-id="schedule" aria-label="n8n SCHEDULE + TIMEZONE"><title>n8n SCHEDULE + TIMEZONE · Independent daily job; no user prompt is required.</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">n8n SCHEDULE + TIMEZONE</tspan></text></g><g data-node-id="claim" aria-label="n8n CLAIM BATCH KEY"><title>n8n CLAIM BATCH KEY · Atomically claim stream + scheduled window + configuration version. An existing execution is reconciled, not duplicated.</title><polygon points="540,340 680,396 540,452 400,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">n8n CLAIM BATCH KEY</tspan></text></g><g data-node-id="pending" aria-label="IN PROGRESS → END"><title>IN PROGRESS → END · Return the existing execution status; do not launch another provider attempt or publish an incomplete batch.</title><rect x="220" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="610">IN PROGRESS → END</tspan></text></g><g data-node-id="plan" aria-label="FREEZE WINDOW + QUERY PLAN"><title>FREEZE WINDOW + QUERY PLAN · Separate macro/fiscal queries and broad geopolitical candidates; no ticker filter. Budget all three queries, retries, quota spacing and possible truncation together.</title><rect x="580" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">FREEZE WINDOW + QUERY PLAN</tspan></text></g><g data-node-id="fetch" aria-label="n8n ALPHA VANTAGE NEWS_SENTIMENT"><title>n8n ALPHA VANTAGE NEWS_SENTIMENT · Use credential-managed API key. At most 3 attempts per query, at most 9 requests/job within the shared deadline and quota. HTTP 200 error/rate-limit payloads are classified before accepting a feed.</title><polygon points="540,760 680,816 540,872 400,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="810">n8n ALPHA VANTAGE</tspan><tspan x="540" y="830">NEWS_SENTIMENT</tspan></text></g><g data-node-id="retry" aria-label="n8n RETRY DECISION"><title>n8n RETRY DECISION · Retry transient errors within per-query and whole-job caps. Quota exhaustion defers/stops; schema/auth errors are permanent.</title><polygon points="360,970 500,1026 360,1082 220,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1030">n8n RETRY DECISION</tspan></text></g><g data-node-id="normalize" aria-label="VALIDATE + DEDUP + GEO TAGS"><title>VALIDATE + DEDUP + GEO TAGS · Normalize dates, provenance and hashes. Tag geopolitical candidates separately; track missing/truncated streams. Publish only completed required query windows, with coverage limits.</title><polygon points="720,970 860,1026 720,1082 580,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1020">VALIDATE + DEDUP + GEO</tspan><tspan x="720" y="1040">TAGS</tspan></text></g><g data-node-id="wait" aria-label="n8n BACKOFF + JITTER"><title>n8n BACKOFF + JITTER · Wait 1s then 2s plus jitter, honor Retry-After and clip to the remaining job budget.</title><rect x="220" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1240">n8n BACKOFF + JITTER</tspan></text></g><g data-node-id="commit" aria-label="COMMIT COMPLETE BATCH"><title>COMMIT COMPLETE BATCH · Evidence versions and batch completion are committed atomically. Snapshot eligibility starts only after commit.</title><polygon points="720,1180 860,1236 720,1292 580,1236" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1240">COMMIT COMPLETE BATCH</tspan></text></g><g data-node-id="failure" aria-label="RECORD FAILED JOB"><title>RECORD FAILED JOB · Persist failure and execution IDs; an uncommitted or partial batch is not eligible evidence.</title><rect x="400" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">RECORD FAILED JOB</tspan></text></g><g data-node-id="prior" aria-label="RETAIN PRIOR COMPLETED BATCH"><title>RETAIN PRIOR COMPLETED BATCH · Keep the original fetched_at and show failure/staleness; do not claim it is today’s successful fetch.</title><rect x="400" y="1600" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">RETAIN PRIOR COMPLETED BATCH</tspan></text></g><g data-node-id="pool" aria-label="POSTGRESQL EVIDENCE POOL"><title>POSTGRESQL EVIDENCE POOL · A later accepted request pins eligible versions and rechecks freshness for its question. No report is generated by the daily job.</title><rect x="400" y="1810" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1870">POSTGRESQL EVIDENCE POOL</tspan></text></g><text x="36" y="1968" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
