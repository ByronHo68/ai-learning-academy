<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1150" width="1800" height="1150" role="img" aria-label="PII protection at every data boundary" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>PII protection at every data boundary</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="privacy-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="privacy-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="privacy-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="privacy-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="privacy-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1800" height="1150" fill="#fcfcf8"></rect><rect width="1800" height="1150" fill="url(#privacy-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · PRIVACY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">PII protection at every data boundary</text><g opacity="1"><path d="M 900 242 C 900 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="546" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="295">User/review entry</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 360 501, 360 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="276" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="360" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="360" y="497">Sanitized before</tspan><tspan x="360" y="513">persistence</tspan></text></g><g opacity="1"><path d="M 360 452 V 504 H 1760 V 918 H 900 V 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-en-stop)"></path><rect x="1618" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1702" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1702" y="715">Detector failure</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="726" y="269" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="287">Independent news</tspan><tspan x="810" y="303">ingestion</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 720 501, 720 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="636" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="497">Sanitize before</tspan><tspan x="720" y="513">indexing</tspan></text></g><g opacity="1"><path d="M 720 452 V 504 H 1736 V 918 H 900 V 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-en-stop)"></path><rect x="1594" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1678" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1678" y="715">No safe excerpt</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1080 291, 1080 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="906" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="990" y="295">Every external boundary</tspan></text></g><g opacity="1"><path d="M 1080 452 C 1080 501, 1080 501, 1080 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="996" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1080" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1080" y="505">Sanitized state only</tspan></text></g><g opacity="1"><path d="M 1080 452 V 504 H 1712 V 918 H 900 V 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-en-stop)"></path><rect x="1570" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1654" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1654" y="715">Cannot sanitize result</tspan></text></g><g opacity="1"><path d="M 1080 662 C 1080 711, 1080 711, 1080 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="996" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1080" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1080" y="715">Support remains</tspan></text></g><g opacity="1"><path d="M 1080 662 C 1080 711, 720 711, 720 760" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-en-stop)"></path><rect x="816" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="900" y="715">Required support lost</tspan></text></g><g opacity="1"><path d="M 1080 872 C 1080 921, 900 921, 900 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-en-stop)"></path><rect x="906" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="990" y="925">Final check fails</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1440 291, 1440 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="1086" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1170" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1170" y="295">Before callback/export</tspan></text></g><g opacity="1"><path d="M 1440 452 C 1440 501, 1440 501, 1440 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-en-flow)"></path><rect x="1356" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1440" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1440" y="497">Redacted allowlisted</tspan><tspan x="1440" y="513">spans</tspan></text></g><g data-node-id="policy" aria-label="EMAIL + CARD → REDACT"><title>EMAIL + CARD → REDACT · One versioned policy across entry, ingestion, models, persistence and telemetry. These branches show responsibilities, not parallel execution.</title><polygon points="900,130 1040,186 900,242 760,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="190">EMAIL + CARD → REDACT</tspan></text></g><g data-node-id="entry" aria-label="API PRIVACY BEFORE GRAPH"><title>API PRIVACY BEFORE GRAPH · Sanitize prompt and review text before any graph invocation, raw body logging, n8n arguments or checkpoint. Detector failure rejects the request.</title><polygon points="360,340 500,396 360,452 220,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="390">API PRIVACY BEFORE</tspan><tspan x="360" y="410">GRAPH</tspan></text></g><g data-node-id="ingest" aria-label="n8n NEWS → SANITIZED EXCERPTS"><title>n8n NEWS → SANITIZED EXCERPTS · Company/daily news is untrusted. Redact before committing the searchable excerpt. Disable raw n8n execution payload retention.</title><polygon points="720,340 860,396 720,452 580,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="390">n8n NEWS → SANITIZED</tspan><tspan x="720" y="410">EXCERPTS</tspan></text></g><g data-node-id="calls" aria-label="RERANK / LLM / TOOL WRAPPERS"><title>RERANK / LLM / TOOL WRAPPERS · Sanitize input and tool arguments before dispatch. Sanitize results before returning a node state update. Buffer model output; disable raw streaming/callback capture.</title><polygon points="1080,340 1220,396 1080,452 940,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="390">RERANK / LLM / TOOL</tspan><tspan x="1080" y="410">WRAPPERS</tspan></text></g><g data-node-id="telemetry" aria-label="SAFE ATTRIBUTES → COLLECTOR"><title>SAFE ATTRIBUTES → COLLECTOR · Allowlist IDs, policy, counts, status, tokens and timing before export. No raw prompts, payloads or exception strings.</title><rect x="1300" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1440" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1440" y="400">SAFE ATTRIBUTES → COLLECTOR</tspan></text></g><g data-node-id="scope" aria-label="SANITIZED REQUEST → SCOPE"><title>SANITIZED REQUEST → SCOPE · Custom scope calls use explicit wrappers. Sanitized original_question preserves research intent. No news refresh before scope accepts.</title><rect x="220" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="610">SANITIZED REQUEST → SCOPE</tspan></text></g><g data-node-id="store" aria-label="POSTGRESQL + CHUNKS + VECTORS"><title>POSTGRESQL + CHUNKS + VECTORS · Commit sanitized versions with provenance, policy and model keys. Idempotent dedup keeps stable source identity; unsafe historical vectors are withdrawn.</title><rect x="580" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">POSTGRESQL + CHUNKS + VECTORS</tspan></text></g><g data-node-id="coverage" aria-label="RECHECK SUPPORT + CITATIONS"><title>RECHECK SUPPORT + CITATIONS · Redaction cannot manufacture evidence. Lost support returns insufficient; privacy filtering cannot authorize tools or remove injection checks.</title><polygon points="1080,550 1220,606 1080,662 940,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="600">RECHECK SUPPORT +</tspan><tspan x="1080" y="620">CITATIONS</tspan></text></g><g data-node-id="traces" aria-label="LANGFUSE + LANGSMITH"><title>LANGFUSE + LANGSMITH · Only sanitized operational spans reach both destinations; sharing requires the sanitized trace view.</title><rect x="1300" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1440" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1440" y="610">LANGFUSE + LANGSMITH</tspan></text></g><g data-node-id="insufficient" aria-label="INSUFFICIENT EVIDENCE → END"><title>INSUFFICIENT EVIDENCE → END · Redaction removed required support. Withhold the affected conclusion and explain the missing facet without exposing removed values.</title><rect x="580" y="760" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">INSUFFICIENT EVIDENCE → END</tspan></text></g><g data-node-id="release" aria-label="FINAL PRIVACY CHECK → SAVE"><title>FINAL PRIVACY CHECK → SAVE · Check the sanitized draft before report persistence/export. Graph checkpoints contain safe state only, including the scope and generate updates.</title><rect x="940" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="820">FINAL PRIVACY CHECK → SAVE</tspan></text></g><g data-node-id="stop" aria-label="PRIVACY BLOCKED / WITHHOLD"><title>PRIVACY BLOCKED / WITHHOLD · Detector failure stops the affected path. No raw fallback, automatic privacy retry, raw checkpoint or sensitive error log.</title><rect x="760" y="970" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1030">PRIVACY BLOCKED / WITHHOLD</tspan></text></g><text x="36" y="1128" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
