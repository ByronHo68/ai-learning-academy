<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1780" width="900" height="1780" role="img" aria-label="Where AsyncPostgresSaver fits in your project" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Where AsyncPostgresSaver fits in your project</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="checkpoint_architecture-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="checkpoint_architecture-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="checkpoint_architecture-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="checkpoint_architecture-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="checkpoint_architecture-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="900" height="1780" fill="#fcfcf8"></rect><rect width="900" height="1780" fill="url(#checkpoint_architecture-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · CHECKPOINT_ARCHITECTURE · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Where AsyncPostgresSaver fits in your project</text><g opacity="1"><path d="M 450 242 C 450 291, 450 291, 450 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="366" y="269" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="287">Authorized thread</tspan><tspan x="450" y="303">config</tspan></text></g><g opacity="1"><path d="M 450 452 C 450 501, 450 501, 450 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="366" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="505">Accepted request</tspan></text></g><g opacity="1"><path d="M 450 662 C 450 711, 450 711, 450 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="366" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="715">Committed receipt</tspan></text></g><g opacity="1"><path d="M 450 872 C 450 921, 450 921, 450 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="366" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="925">Ranked evidence</tspan></text></g><g opacity="1"><path d="M 450 1082 C 450 1131, 450 1131, 450 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="366" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1135">Validated selection</tspan></text></g><g opacity="1"><path d="M 450 452 V 504 H 860 V 1338 H 450 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="718" y="899" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="802" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="802" y="917">Initial state / step</tspan><tspan x="802" y="933">boundaries</tspan></text></g><g opacity="1"><path d="M 450 662 V 686 H 836 V 1366 H 450 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="694" y="1012" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="778" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="778" y="1030">Receipt reference</tspan></text></g><g opacity="1"><path d="M 450 872 V 910 H 812 V 1352 H 450 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="670" y="1109" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="754" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="754" y="1127">Snapshot + IDs +</tspan><tspan x="754" y="1143">counters</tspan></text></g><g opacity="1"><path d="M 450 1082 V 1134 H 788 V 1338 H 450 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="646" y="1214" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="730" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="730" y="1232">Pending interrupt +</tspan><tspan x="730" y="1248">state</tspan></text></g><g opacity="1"><path d="M 450 1292 C 450 1341, 450 1341, 450 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="366" y="1319" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1337">Report reference +</tspan><tspan x="450" y="1353">status</tspan></text></g><g opacity="1"><path d="M 450 1502 C 450 1551, 450 1551, 450 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_architecture-en-flow)"></path><rect x="366" y="1529" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1547">Persist / load via</tspan><tspan x="450" y="1563">async I/O</tspan></text></g><g data-node-id="api" aria-label="PYTHON API + OWNER / RUN"><title>PYTHON API + OWNER / RUN · Authenticate and resolve the server-owned thread before every start, inspect or resume.</title><rect x="310" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="190">PYTHON API + OWNER / RUN</tspan></text></g><g data-node-id="graph" aria-label="LANGGRAPH RESEARCH GRAPH"><title>LANGGRAPH RESEARCH GRAPH · Runs nodes and conditional edges. Compile with checkpointer=saver once per application lifespan.</title><polygon points="450,340 590,396 450,452 310,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="390">LANGGRAPH RESEARCH</tspan><tspan x="450" y="410">GRAPH</tspan></text></g><g data-node-id="n8n" aria-label="HOST refresh: n8n RECEIPT"><title>HOST refresh: n8n RECEIPT · The LangGraph refresh node calls n8n and checkpoints the returned receipt reference. n8n owns acquisition retries and receipt reconciliation; its daily Alpha Vantage job is separate.</title><polygon points="450,550 590,606 450,662 310,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="600">HOST refresh: n8n</tspan><tspan x="450" y="620">RECEIPT</tspan></text></g><g data-node-id="rank" aria-label="SNAPSHOT → SEARCH → RANK"><title>SNAPSHOT → SEARCH → RANK · Use the pinned evidence versions and retrieval view, then save ranked source IDs and search counters.</title><polygon points="450,760 590,816 450,872 310,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="810">SNAPSHOT → SEARCH →</tspan><tspan x="450" y="830">RANK</tspan></text></g><g data-node-id="review" aria-label="REVIEW interrupt()"><title>REVIEW interrupt() · Pause for source exclusions/order. Completed acquisition stays outside the interrupted node.</title><polygon points="450,970 590,1026 450,1082 310,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="1030">REVIEW interrupt()</tspan></text></g><g data-node-id="report" aria-label="EVIDENCE GATE → LLM → REPORT"><title>EVIDENCE GATE → LLM → REPORT · Check selected evidence and budgets, then validate and persist the result in the business database.</title><rect x="310" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="1240">EVIDENCE GATE → LLM → REPORT</tspan></text></g><g data-node-id="saver" aria-label="AsyncPostgresSaver"><title>AsyncPostgresSaver · Framework persistence adapter. Save graph state at checkpoint boundaries; async I/O is separate from durability mode.</title><rect x="310" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="1450">AsyncPostgresSaver</tspan></text></g><g data-node-id="checkpoint_db" aria-label="POSTGRESQL research_checkpoints"><title>POSTGRESQL research_checkpoints · Library-owned checkpoint tables store thread-scoped progress; they do not replace news, reports or n8n metadata.</title><rect x="310" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="450" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="450" y="1650">POSTGRESQL</tspan><tspan x="450" y="1670">research_checkpoints</tspan></text></g><text x="36" y="1758" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
