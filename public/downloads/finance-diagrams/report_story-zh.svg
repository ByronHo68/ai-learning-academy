<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1360" width="1440" height="1360" role="img" aria-label="選擇資料並呈現報告" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>選擇資料並呈現報告</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="report_story-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="report_story-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="report_story-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="report_story-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="report_story-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1440" height="1360" fill="#fcfcf8"></rect><rect width="1440" height="1360" fill="url(#report_story-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · REPORT_STORY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">選擇資料並呈現報告</text><g opacity="1"><path d="M 720 242 C 720 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">公司研究</tspan></text></g><g opacity="1"><path d="M 720 242 C 720 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="636" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="295">純報價（建議）</tspan></text></g><g opacity="1"><path d="M 720 242 C 720 291, 1080 291, 1080 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="816" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="295">純圖表（建議）</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="366" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="505">證據充足</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 900 501, 900 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#report_story-zh-stop)"></path><rect x="546" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="505">證據仍然不足</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 720 711, 720 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="546" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="715">已清理 JSON</tspan></text></g><g opacity="1"><path d="M 720 872 C 720 921, 720 921, 720 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="636" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="925">草稿及來源 ID</tspan></text></g><g opacity="1"><path d="M 720 1082 C 720 1131, 720 1131, 720 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="636" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="1135">已驗證報告</tspan></text></g><g opacity="1"><path d="M 720 452 V 504 H 1400 V 1128 H 720 V 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="1258" y="802" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1342" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1342" y="820">有日期的觀測值</tspan></text></g><g opacity="1"><path d="M 1080 452 V 476 H 1376 V 1156 H 720 V 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-zh-flow)"></path><rect x="1234" y="802" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1318" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1318" y="820">已排序的觀測值</tspan></text></g><g data-node-id="scope" aria-label="ROUTE QUESTION"><title>ROUTE QUESTION · 確認公司及所需資料。項目報告路線接納支援公司的研究問題；純報價及純圖表路線是建議擴展。</title><polygon points="720,130 860,186 720,242 580,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="190">ROUTE QUESTION</tspan></text></g><g data-node-id="evidence" aria-label="REVIEW EVIDENCE"><title>REVIEW EVIDENCE · 從經核准的 n8n 證據檢索相關段落。已啟用時進行重排；如使用者要求覆核，先讓其檢查選取結果。呼叫報告模型前確認證據足夠。</title><polygon points="360,340 500,396 360,452 220,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="400">REVIEW EVIDENCE</tspan></text></g><g data-node-id="quote" aria-label="VALIDATE QUOTE"><title>VALIDATE QUOTE · 建議的報價路線使用 YFinance 報價回應。顯示金額、貨幣、價格口徑、市場時間、抓取時間及可用的交易時段資料。延遲未知時標示未知。</title><rect x="580" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">VALIDATE QUOTE</tspan></text></g><g data-node-id="history" aria-label="VALIDATE PRICE HISTORY"><title>VALIDATE PRICE HISTORY · 建議的歷史價格路線需要專用資料工具。驗證日期範圍、排序、貨幣、間隔、調整口徑及缺漏列。在程式中用同一序列計算變動及繪圖。</title><rect x="940" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="400">VALIDATE PRICE HISTORY</tspan></text></g><g data-node-id="context" aria-label="BUILD CONTEXT"><title>BUILD CONTEXT · 以 JSON 傳送問題及獲准節錄。現有 gateway 接收每項來源的 ID、節錄及發布時間。App 另外保存引用網址、數值報價及圖表輸入。</title><rect x="400" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="610">BUILD CONTEXT</tspan></text></g><g data-node-id="gap" aria-label="SHOW EVIDENCE GAP"><title>SHOW EVIDENCE GAP · 說明缺少哪項證據，回傳證據不足的結果。</title><rect x="760" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="610">SHOW EVIDENCE GAP</tspan></text></g><g data-node-id="generate" aria-label="GENERATE JSON DRAFT"><title>GENERATE JSON DRAFT · 以報告系統提示、context JSON 及嚴格的回應 schema 呼叫 chat completions。草稿包含答案、事實、有證據支持的條件式情境及限制。</title><rect x="580" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">GENERATE JSON DRAFT</tspan></text></g><g data-node-id="validate" aria-label="VALIDATE AND SAVE"><title>VALIDATE AND SAVE · 驗證 JSON，並確認每個引用 ID 可解析到已存證據。確認引文支持每項重要主張，再一併保存通過驗證的報告及引用連結。</title><rect x="580" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1030">VALIDATE AND SAVE</tspan></text></g><g data-node-id="render" aria-label="RENDER RESULT"><title>RENDER RESULT · 在網頁顯示已驗證輸出。研究報告的 Markdown 下載及可列印 PDF 使用同一份已存報告。純市場資料請求直接以已驗證觀測值呈現。</title><rect x="580" y="1180" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1240">RENDER RESULT</tspan></text></g><text x="36" y="1338" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
