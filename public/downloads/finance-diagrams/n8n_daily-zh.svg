acity="1"><path d="M 540 452 C 540 501, 720 501, 720 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-zh-flow)"></path><rect x="546" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="505">新批次 lease</tspan></text></g><g opacity="1"><path d="M 720 662 C 720 711, 540 711, 540 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-zh-flow)"></path><rect x="546" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="715">有預算查詢視窗</tspan></text></g><g opacity="1"><path d="M 540 452 V 476 H 1040 V 1786 H 540 V 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-zh-flow)"></path><rect x="898" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="982" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="982" y="1135">已有完整批次</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 360 501, 360 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-zh-stop)"></path><rect x="366" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="450" y="505">已有執行中工作</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 720 921, 720 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-zh-flow)"></path><rect x="546" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="925">收到回應</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 360 921, 360 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-zh-flow)"></path><rect x="366" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="925">供應商錯誤</tspan></text></g><g opacity="1"><path d="M 360 1082 C 360 1131, 360 1131, 360 1180" fill="none" stroke="#7251a1" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#n8n_daily-zh-retry)"></path><rect x="276" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#7251a1" stroke-opacity=".23"></rect><text x="360" text-anchor="middle" fill="#7251a1" font-size="12" font-weight="600"><tspan x="360" y="1135">暫時錯誤＋有餘額</tspan></text></g><g opacity="1"><path d="M 220 1236 H 65 V 816 H 400" fill="none" stroke="#7251a1" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#n8n_daily-zh-retry)"></path><rect x="16" y="1012" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#7251a1" stroke-opacity=".23"></rect><text x="100" text-anchor="middle" fill="#7251a1" font-size="12" font-weight="600"><tspan x="100" y="1030">同批次下一嘗試</tspan></text></g><g opacity="1"><path d="M 360 1082 V 1106 H 1016 V 1366 H 540 V 1390" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-zh-stop)"></path><rect x="874" y="1222" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="958" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="958" y="1240">永久錯誤／用完</tspan></text></g><g opacity="1"><path d="M 720 1082 C 720 1131, 720 1131, 720 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-zh-flow)"></path><rect x="636" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="1135">批次有效</tspan></text></g><g opacity="1"><path d="M 720 1082 V 1134 H 992 V 1338 H 540 V 1390" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-zh-stop)"></path><rect x="850" y="1222" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="934" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="934" y="1240">無效／未完整</tspan></text></g><g opacity="1"><path d="M 720 1292 V 1316 H 968 V 1786 H 540 V 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#n8n_daily-zh-flow)"></path><rect x="826" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="910" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="910" y="1555">完整版本就緒</tspan></text></g><g opacity="1"><path d="M 720 1292 C 720 1341, 540 1341, 540 1390" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#n8n_daily-zh-stop)"></path><rect x="546" y="1319" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="1337">Transaction</tspan><tspan x="630" y="1353">已回滾</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#n8n_daily-zh-fallback)"></path><rect x="456" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="540" y="1555">保留舊完整批次</tspan></text></g><g opacity="1"><path d="M 540 1712 C 540 1761, 540 1761, 540 1810" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#n8n_daily-zh-fallback)"></path><rect x="456" y="1747" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="540" y="1765">原年齡＋失敗狀態</tspan></text></g><g data-node-id="schedule" aria-label="n8n SCHEDULE + TIMEZONE"><title>n8n SCHEDULE + TIMEZONE · 獨立每日工作，不需要用戶提示。</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">n8n SCHEDULE + TIMEZONE</tspan></text></g><g data-node-id="claim" aria-label="n8n CLAIM BATCH KEY"><title>n8n CLAIM BATCH KEY · 原子取得來源＋排程期間＋設定版本批次鍵；已有執行先核對，不重複。</title><polygon points="540,340 680,396 540,452 400,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">n8n CLAIM BATCH KEY</tspan></text></g><g data-node-id="pending" aria-label="IN PROGRESS → END"><title>IN PROGRESS → END · 回傳原執行狀態，不另開供應商嘗試或發布未完整批次。</title><rect x="220" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="610">IN PROGRESS → END</tspan></text></g><g data-node-id="plan" aria-label="FREEZE WINDOW + QUERY PLAN"><title>FREEZE WINDOW + QUERY PLAN · 分開宏觀／財政及廣泛地緣候選，不設 ticker；三查詢、重試、配額間隔及可能截斷共用預算。</title><rect x="580" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">FREEZE WINDOW + QUERY PLAN</tspan></text></g><g data-node-id="fetch" aria-label="n8n ALPHA VANTAGE NEWS_SENTIMENT"><title>n8n ALPHA VANTAGE NEWS_SENTIMENT · API 金鑰用憑證管理；每查詢最多三次，整工作最多九請求，受共用時限及配額限制。HTTP 200 的錯誤／限流內容須分類後才接納。</title><polygon points="540,760 680,816 540,872 400,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="810">n8n ALPHA VANTAGE</tspan><tspan x="540" y="830">NEWS_SENTIMENT</tspan></text></g><g data-node-id="retry" aria-label="n8n RETRY DECISION"><title>n8n RETRY DECISION · 只在每查詢及整工作上限內重試暫時錯誤；配額用完延後／停止，格式／認證錯誤不重試。</title><polygon points="360,970 500,1026 360,1082 220,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1030">n8n RETRY DECISION</tspan></text></g><g data-node-id="normalize" aria-label="VALIDATE + DEDUP + GEO TAGS"><title>VALIDATE + DEDUP + GEO TAGS · 正規化日期、來源及 hash；地緣候選另作標記，追蹤缺少／截斷來源。只發布已完成必要查詢視窗，並附覆蓋限制。</title><polygon points="720,970 860,1026 720,1082 580,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1020">VALIDATE + DEDUP + GEO</tspan><tspan x="720" y="1040">TAGS</tspan></text></g><g data-node-id="wait" aria-label="n8n BACKOFF + JITTER"><title>n8n BACKOFF + JITTER · 等待 1 秒、2 秒加 jitter，遵守 Retry-After 並限制於工作餘額。</title><rect x="220" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1240">n8n BACKOFF + JITTER</tspan></text></g><g data-node-id="commit" aria-label="COMMIT COMPLETE BATCH"><title>COMMIT COMPLETE BATCH · 證據版本及批次完成狀態原子提交，之後才可入快照。</title><polygon points="720,1180 860,1236 720,1292 580,1236" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1240">COMMIT COMPLETE BATCH</tspan></text></g><g data-node-id="failure" aria-label="RECORD FAILED JOB"><title>RECORD FAILED JOB · 保存失敗及執行 ID；未提交或部分批次不能當合資格證據。</title><rect x="400" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">RECORD FAILED JOB</tspan></text></g><g data-node-id="prior" aria-label="RETAIN PRIOR COMPLETED BATCH"><title>RETAIN PRIOR COMPLETED BATCH · 保留原 fetched_at 及失敗／過期狀態，不能聲稱今日成功抓取。</title><rect x="400" y="1600" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">RETAIN PRIOR COMPLETED BATCH</tspan></text></g><g data-node-id="pool" aria-label="POSTGRESQL EVIDENCE POOL"><title>POSTGRESQL EVIDENCE POOL · 之後有效請求固定合資格版本，再按問題重查新鮮度；每日工作不生成報告。</title><rect x="400" y="1810" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1870">POSTGRESQL EVIDENCE POOL</tspan></text></g><text x="36" y="1968" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
