<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1150" width="1080" height="1150" role="img" aria-label="以條件式預測回答提示" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>以條件式預測回答提示</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="report-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="report-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="report-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="report-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="report-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="1150" fill="#fcfcf8"></rect><rect width="1080" height="1150" fill="url(#report-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · REPORT · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">以條件式預測回答提示</text><g opacity="1"><path d="M 540 242 C 540 291, 540 291, 540 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report-zh-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">讀取＋裁剪</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report-zh-flow)"></path><rect x="456" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="505">生成草稿</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 540 711, 540 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report-zh-flow)"></path><rect x="456" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="715">核對支持</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 360 921, 360 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#report-zh-stop)"></path><rect x="366" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="450" y="925">無效</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 720 921, 720 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report-zh-flow)"></path><rect x="546" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="925">有效＋已存</tspan></text></g><g data-node-id="Selected passages" aria-label="Selected passages"><title>Selected passages</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">Selected passages</tspan></text></g><g data-node-id="Context envelope" aria-label="Context envelope"><title>Context envelope</title><rect x="400" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">Context envelope</tspan></text></g><g data-node-id="Draft" aria-label="Draft"><title>Draft</title><rect x="400" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="610">Draft</tspan></text></g><g data-node-id="Validation" aria-label="Validation"><title>Validation</title><polygon points="540,760 680,816 540,872 400,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="820">Validation</tspan></text></g><g data-node-id="Blocked → END" aria-label="Blocked → END"><title>Blocked → END</title><rect x="220" y="970" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1030">Blocked → END</tspan></text></g><g data-node-id="Display + feedback" aria-label="Display + feedback"><title>Display + feedback</title><rect x="580" y="970" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1030">Display + feedback</tspan></text></g><text x="36" y="1128" font-size="11" fill="#536b72">虛構教學設計 · 原截止及預算適用於所有重試 · 節點技術名稱保留英文</text></svg>
