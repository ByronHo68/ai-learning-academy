t="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="1135">原上限內</tspan></text></g><g data-node-id="request" aria-label="API: AUTHENTICATE OWNER"><title>API: AUTHENTICATE OWNER · Client 不能指定任意 thread 狀態或另一擁有者 ID。</title><polygon points="900,130 1040,186 900,242 760,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="180">API: AUTHENTICATE</tspan><tspan x="900" y="200">OWNER</tspan></text></g><g data-node-id="load" aria-label="LOAD LATEST AUTHORIZED CHECKPOINT"><title>LOAD LATEST AUTHORIZED CHECKPOINT · 解析 run → thread，以 saver 查看已存進度。</title><polygon points="900,340 1040,396 900,452 760,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="390">LOAD LATEST AUTHORIZED</tspan><tspan x="900" y="410">CHECKPOINT</tspan></text></g><g data-node-id="check" aria-label="STATUS + BUDGET + EXPIRY"><title>STATUS + BUDGET + EXPIRY · 核對模型／程式相容性、當前權限、處理餘額及覆核期限。</title><polygon points="900,550 1040,606 900,662 760,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="600">STATUS + BUDGET +</tspan><tspan x="900" y="620">EXPIRY</tspan></text></g><g data-node-id="review" aria-label="PENDING REVIEW: Command(resume=...)"><title>PENDING REVIEW: Command(resume=...) · 驗證及原子保存來源選取版本，再重入中斷覆核節點。</title><rect x="220" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="810">PENDING REVIEW:</tspan><tspan x="360" y="830">Command(resume=...)</tspan></text></g><g data-node-id="failed" aria-label="FAILED NODE: ainvoke(None, config)"><title>FAILED NODE: ainvoke(None, config) · 繼續未完成工作；若 refresh 未記錄 checkpoint，先核對外部收據。</title><rect x="580" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="810">FAILED NODE: ainvoke(None,</tspan><tspan x="720" y="830">config)</tspan></text></g><g data-node-id="done" aria-label="ALREADY COMPLETE → RETURN REPORT"><title>ALREADY COMPLETE → RETURN REPORT · 取回已存結果，不再生成。</title><rect x="940" y="760" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="810">ALREADY COMPLETE → RETURN</tspan><tspan x="1080" y="830">REPORT</tspan></text></g><g data-node-id="stop" aria-label="REJECT / EXPIRED / MISSING → END"><title>REJECT / EXPIRED / MISSING → END · 說明授權失敗、預算過期或無 checkpoint，不能暗中新建任務。</title><rect x="1300" y="760" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1440" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1440" y="810">REJECT / EXPIRED / MISSING →</tspan><tspan x="1440" y="830">END</tspan></text></g><g data-node-id="continue" aria-label="REUSE COMPLETED WORK"><title>REUSE COMPLETED WORK · 保留原快照、次數及處理餘額，發布前再驗證。</title><rect x="760" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1030">REUSE COMPLETED WORK</tspan></text></g><g data-node-id="save" aria-label="NEW CHECKPOINT / NEXT STEP"><title>NEW CHECKPOINT / NEXT STEP · Saver 寫更新進度，原證據及歷史仍可識別。</title><rect x="760" y="1180" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1240">NEW CHECKPOINT / NEXT STEP</tspan></text></g><text x="36" y="1338" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
