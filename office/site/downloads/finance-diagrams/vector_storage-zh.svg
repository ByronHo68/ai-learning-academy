<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1360" width="1080" height="1360" role="img" aria-label="PostgreSQL 為向量檢索存甚麼" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>PostgreSQL 為向量檢索存甚麼</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="vector_storage-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="vector_storage-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="vector_storage-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="vector_storage-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="vector_storage-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="1360" fill="#fcfcf8"></rect><rect width="1080" height="1360" fill="url(#vector_storage-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · VECTOR_STORAGE · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">PostgreSQL 為向量檢索存甚麼</text><g opacity="1"><path d="M 540 242 C 540 291, 540 291, 540 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#vector_storage-zh-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">驗證＋去重</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#vector_storage-zh-flow)"></path><rect x="456" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="505">提交來源版本</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 540 711, 540 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#vector_storage-zh-flow)"></path><rect x="456" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="715">已提交且待建向量段落</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 360 921, 360 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#vector_storage-zh-flow)"></path><rect x="366" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="925">核對 384 維＋來源</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 720 921, 720 970" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#vector_storage-zh-fallback)"></path><rect x="546" y="899" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="630" y="917">Embedding</tspan><tspan x="630" y="933">不可用</tspan></text></g><g opacity="1"><path d="M 540 662 V 714 H 1040 V 1128 H 540 V 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#vector_storage-zh-flow)"></path><rect x="898" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="982" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="982" y="925">合資格文字版本</tspan></text></g><g opacity="1"><path d="M 360 1082 C 360 1131, 540 1131, 540 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#vector_storage-zh-flow)"></path><rect x="366" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1135">相容就緒向量</tspan></text></g><g opacity="1"><path d="M 540 662 V 700 H 1016 V 932 H 720 V 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#vector_storage-zh-flow)"></path><rect x="874" y="802" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="958" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="958" y="820">Sparse 仍可用</tspan></text></g><g data-node-id="sources" aria-label="YFINANCE / ALPHA VANTAGE / PROFILE"><title>YFINANCE / ALPHA VANTAGE / PROFILE · 不同抓取路徑供允許證據，模型不取代來源。</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="180">YFINANCE / ALPHA VANTAGE /</tspan><tspan x="540" y="200">PROFILE</tspan></text></g><g data-node-id="chunks" aria-label="CHUNK + CONTENT HASH"><title>CHUNK + CONTENT HASH · 版本化原文、來源、日期、公司／主題、權限及快照成員。</title><rect x="400" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">CHUNK + CONTENT HASH</tspan></text></g><g data-node-id="model" aria-label="PYTHON: MULTILINGUAL E5 CANDIDATE"><title>PYTHON: MULTILINGUAL E5 CANDIDATE · 以固定模型 revision 及正規化編碼 passage 段落，建立 384 維向量。</title><polygon points="540,760 680,816 540,872 400,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="810">PYTHON: MULTILINGUAL</tspan><tspan x="540" y="830">E5 CANDIDATE</tspan></text></g><g data-node-id="text" aria-label="POSTGRESQL TEXT + FTS + METADATA"><title>POSTGRESQL TEXT + FTS + METADATA · 原文及全文搜尋毋須 embedding，抓取收據毋須等向量。</title><polygon points="540,550 680,606 540,662 400,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="600">POSTGRESQL TEXT + FTS</tspan><tspan x="540" y="620">+ METADATA</tspan></text></g><g data-node-id="vector" aria-label="pgvector vector(384) + MODEL KEY"><title>pgvector vector(384) + MODEL KEY · 數值向量連結穩定段落；不能因 E5／BGE 同為 384 維就混用。</title><rect x="220" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1020">pgvector vector(384) + MODEL</tspan><tspan x="360" y="1040">KEY</tspan></text></g><g data-node-id="fallback" aria-label="PENDING / FAILURE → FULL-TEXT"><title>PENDING / FAILURE → FULL-TEXT · 維持 sparse 預設或回退；向量未就緒不能稱索引完整。</title><rect x="580" y="970" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1030">PENDING / FAILURE → FULL-TEXT</tspan></text></g><g data-node-id="ready" aria-label="SNAPSHOT + VECTOR READINESS"><title>SNAPSHOT + VECTOR READINESS · 固定相容已索引段落及模型設定，補查／恢復沿用同一檢索視圖。</title><rect x="400" y="1180" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1240">SNAPSHOT + VECTOR READINESS</tspan></text></g><text x="36" y="1338" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
