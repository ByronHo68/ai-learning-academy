<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2830" width="1080" height="2830" role="img" aria-label="股票研究 RAG：由新聞到引用" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>股票研究 RAG：由新聞到引用</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="rag_story-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="rag_story-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="rag_story-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="rag_story-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="rag_story-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="2830" fill="#fcfcf8"></rect><rect width="1080" height="2830" fill="url(#rag_story-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · RAG_STORY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">股票研究 RAG：由新聞到引用</text><g opacity="1"><path d="M 540 242 C 540 291, 540 291, 540 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">已驗證 n8n 收據</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="505">已接納來源</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 540 711, 540 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="715">已清理節錄</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 540 921, 540 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="925">Embedding 回應</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 540 1131, 540 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1135">模型、索引及向量</tspan></text></g><g opacity="1"><path d="M 540 1292 C 540 1341, 540 1341, 540 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1345">所有向量通過驗證</tspan></text></g><g opacity="1"><path d="M 540 1292 V 1316 H 1040 V 1576 H 540 V 1600" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#rag_story-zh-fallback)"></path><rect x="898" y="1432" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="982" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="982" y="1450">無效批次 → 全文</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1555">固定相容已就緒向量</tspan></text></g><g opacity="1"><path d="M 540 1712 C 540 1761, 540 1761, 540 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="1747" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1765">範圍、截止及准許 ID</tspan></text></g><g opacity="1"><path d="M 540 1922 C 540 1971, 540 1971, 540 2020" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="1957" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1975">混合已獲准</tspan></text></g><g opacity="1"><path d="M 540 1922 V 1960 H 1016 V 2192 H 540 V 2230" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="874" y="2062" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="958" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="958" y="2080">預設全文</tspan></text></g><g opacity="1"><path d="M 540 2132 C 540 2181, 540 2181, 540 2230" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="456" y="2167" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="2185">已排序段落</tspan></text></g><g opacity="1"><path d="M 540 2342 C 540 2391, 360 2391, 360 2440" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="366" y="2377" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="2395">證據足夠</tspan></text></g><g opacity="1"><path d="M 540 2342 C 540 2391, 720 2391, 720 2440" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#rag_story-zh-stop)"></path><rect x="546" y="2377" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="2395">核對後支持不足</tspan></text></g><g opacity="1"><path d="M 360 2552 C 360 2601, 540 2601, 540 2650" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rag_story-zh-flow)"></path><rect x="366" y="2587" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="2605">草稿及引用</tspan></text></g><g data-node-id="fetch" aria-label="FETCH"><title>FETCH · n8n 向固定工具索取最多三篇公司新聞。故事追蹤 news 陣列中的一篇。每日宏觀新聞及經審核的公司背景也可提供其他合資格證據。</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">FETCH</tspan></text></g><g data-node-id="admit" aria-label="ADMIT"><title>ADMIT · n8n 驗證、清理、去重及提交批次。App 檢查權限、日期及來源範圍後才接納版本，並管理文章 ID、網址、時間及政策。</title><rect x="400" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">ADMIT</tspan></text></g><g data-node-id="chunk" aria-label="CHUNK"><title>CHUNK · 使用固定切段策略。此短例有兩段，方便檢視批次。把段落 ID、來源 ID、範圍及文字存入 stock_rag.chunks。</title><rect x="400" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="610">CHUNK</tspan></text></g><g data-node-id="request" aria-label="SEND TEXT"><title>SEND TEXT · 由伺服器的 worker 用核准模型及供應商 POST /embeddings。input 陣列包含允許的節錄。Worker 在本機按相同順序保留段落 ID。</title><rect x="400" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="820">SEND TEXT</tspan></text></g><g data-node-id="response" aria-label="READ VECTORS"><title>READ VECTORS · OpenRouter 回傳模型及 data 陣列，每項有 index 與 embedding。例子刻意倒序，展示 index 的用途。你的引用 metadata 保存在自己的資料庫。</title><rect x="400" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1030">READ VECTORS</tspan></text></g><g data-node-id="join" aria-label="JOIN"><title>JOIN · 核對回傳模型、有限數值、向量維度，以及每個輸入 index 恰好有一項結果。用 inputChunkIds[index] 配對。整批不合格時在寫入任何向量前拒絕。</title><polygon points="540,1180 680,1236 540,1292 400,1236" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1240">JOIN</tspan></text></g><g data-node-id="store" aria-label="STORE"><title>STORE · 把每個已核對的向量按段落 ID 及模型設定存入相容的 pgvector 表。來源及段落表保留標題、日期、網址及節錄。重跑時重用完全相符的向量。</title><rect x="400" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">STORE</tspan></text></g><g data-node-id="snapshot" aria-label="FREEZE"><title>FREEZE · LangGraph 檢查範圍並呼叫指定 n8n 刷新，把合資格段落、as-of 截止及已就緒向量固定於本次任務。檢索與補查沿用此快照。</title><rect x="400" y="1600" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">FREEZE</tspan></text></g><g data-node-id="retrieve" aria-label="RETRIEVE"><title>RETRIEVE · 項目預設全文檢索。混合模式獲准後，用相同相容的模型及設定為問題編碼，在快照過濾下搜尋 pgvector，再結合向量與全文候選。</title><polygon points="540,1810 680,1866 540,1922 400,1866" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1870">RETRIEVE</tspan></text></g><g data-node-id="rerank" aria-label="RERANK"><title>RERANK · 重排器比較問題與每段候選文字。對此問題，支出及利潤段落比容量公告更靠前。次序表示相關程度。</title><rect x="400" y="2020" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="2080">RERANK</tspan></text></g><g data-node-id="review" aria-label="REVIEW"><title>REVIEW · 覆核模式可標記、移除或重排候選。確認所選 ID 在快照中，並在排除及裁剪 context 後重查覆蓋。</title><polygon points="540,2230 680,2286 540,2342 400,2286" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="2290">REVIEW</tspan></text></g><g data-node-id="generate" aria-label="GENERATE"><title>GENERATE · 把選定節錄及引用 ID 加進 prompt。另呼叫 OpenRouter chat endpoint 擬稿。生成模型收到證據文字及引用參照。</title><rect x="220" y="2440" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="2500">GENERATE</tspan></text></g><g data-node-id="gap" aria-label="INSUFFICIENT EVIDENCE"><title>INSUFFICIENT EVIDENCE · 剩餘來源只講容量。說明缺少的證據，在報告生成前停止。</title><rect x="580" y="2440" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="2500">INSUFFICIENT EVIDENCE</tspan></text></g><g data-node-id="validate" aria-label="VALIDATE"><title>VALIDATE · 檢查每項重要主張都有引用原文支持，及所有 ID 屬於快照。缺少支持時，明確回傳證據缺口。</title><rect x="400" y="2650" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="2710">VALIDATE</tspan></text></g><text x="36" y="2808" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
