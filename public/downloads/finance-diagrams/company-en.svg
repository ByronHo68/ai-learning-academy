<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 730" width="1440" height="730" role="img" aria-label="Choose a supported company" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Choose a supported company</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="company-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="company-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="company-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="company-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="company-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1440" height="730" fill="#fcfcf8"></rect><rect width="1440" height="730" fill="url(#company-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · COMPANY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Choose a supported company</text><g opacity="1"><path d="M 720 242 C 720 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#company-en-flow)"></path><rect x="636" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-siz