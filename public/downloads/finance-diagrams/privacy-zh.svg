<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1150" width="1800" height="1150" role="img" aria-label="每個資料邊界的 PII 保護" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>每個資料邊界的 PII 保護</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="privacy-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="privacy-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="privacy-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="privacy-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="privacy-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1800" height="1150" fill="#fcfcf8"></rect><rect width="1800" height="1150" fill="url(#privacy-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · PRIVACY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">每個資料邊界的 PII 保護</text><g opacity="1"><path d="M 900 242 C 900 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="546" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="295">用戶／覆核入口</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 360 501, 360 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="276" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="360" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="360" y="505">持久儲存前已清理</tspan></text></g><g opacity="1"><path d="M 360 452 V 504 H 1760 V 918 H 900 V 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-zh-stop)"></path><rect x="1618" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1702" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1702" y="715">偵測失敗</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="726" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="295">獨立新聞匯入</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 720 501, 720 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="636" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="505">索引前清理</tspan></text></g><g opacity="1"><path d="M 720 452 V 504 H 1736 V 918 H 900 V 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-zh-stop)"></path><rect x="1594" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1678" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1678" y="715">無安全節錄</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1080 291, 1080 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="906" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="990" y="295">每個外部邊界</tspan></text></g><g opacity="1"><path d="M 1080 452 C 1080 501, 1080 501, 1080 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="996" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1080" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1080" y="505">只回安全 state</tspan></text></g><g opacity="1"><path d="M 1080 452 V 504 H 1712 V 918 H 900 V 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-zh-stop)"></path><rect x="1570" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1654" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1654" y="715">結果無法清理</tspan></text></g><g opacity="1"><path d="M 1080 662 C 1080 711, 1080 711, 1080 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="996" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1080" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1080" y="715">仍有支持</tspan></text></g><g opacity="1"><path d="M 1080 662 C 1080 711, 720 711, 720 760" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-zh-stop)"></path><rect x="816" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="900" y="715">必要支持流失</tspan></text></g><g opacity="1"><path d="M 1080 872 C 1080 921, 900 921, 900 970" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#privacy-zh-stop)"></path><rect x="906" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="990" y="925">最終檢查失敗</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1440 291, 1440 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="1086" y="269" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1170" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1170" y="287">Callback／匯出之</tspan><tspan x="1170" y="303">前</tspan></text></g><g opacity="1"><path d="M 1440 452 C 1440 501, 1440 501, 1440 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#privacy-zh-flow)"></path><rect x="1356" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1440" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1440" y="505">清理且核准 spans</tspan></text></g><g data-node-id="policy" aria-label="EMAIL + CARD → REDACT"><title>EMAIL + CARD → REDACT · 同一版本政策涵蓋入口、匯入、模型、持久儲存及追蹤；分支表示責任，不代表並行執行。</title><polygon points="900,130 1040,186 900,242 760,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="190">EMAIL + CARD → REDACT</tspan></text></g><g data-node-id="entry" aria-label="API PRIVACY BEFORE GRAPH"><title>API PRIVACY BEFORE GRAPH · 任何 graph 執行、body log、n8n 參數或 checkpoint 前清理提示及覆核文字，偵測失敗拒絕請求。</title><polygon points="360,340 500,396 360,452 220,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="390">API PRIVACY BEFORE</tspan><tspan x="360" y="410">GRAPH</tspan></text></g><g data-node-id="ingest" aria-label="n8n NEWS → SANITIZED EXCERPTS"><title>n8n NEWS → SANITIZED EXCERPTS · 公司／每日新聞均不可信，可搜尋節錄提交前清理，停用 n8n 原 payload 保留。</title><polygon points="720,340 860,396 720,452 580,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="390">n8n NEWS → SANITIZED</tspan><tspan x="720" y="410">EXCERPTS</tspan></text></g><g data-node-id="calls" aria-label="RERANK / LLM / TOOL WRAPPERS"><title>RERANK / LLM / TOOL WRAPPERS · 發出前清理輸入及工具參數；回傳節點 state 更新前清理結果。模型輸出先緩衝，停用原串流／callback 擷取。</title><polygon points="1080,340 1220,396 1080,452 940,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="390">RERANK / LLM / TOOL</tspan><tspan x="1080" y="410">WRAPPERS</tspan></text></g><g data-node-id="telemetry" aria-label="SAFE ATTRIBUTES → COLLECTOR"><title>SAFE ATTRIBUTES → COLLECTOR · 匯出前只允許 ID、政策、計數、狀態、token 及時間，不帶原提示、payload 或 exception 字串。</title><rect x="1300" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1440" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1440" y="400">SAFE ATTRIBUTES → COLLECTOR</tspan></text></g><g data-node-id="scope" aria-label="SANITIZED REQUEST → SCOPE"><title>SANITIZED REQUEST → SCOPE · 自訂 scope 呼叫用明確 wrapper；original_question 存清理後研究意圖，scope 通過前不刷新新聞。</title><rect x="220" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="610">SANITIZED REQUEST → SCOPE</tspan></text></g><g data-node-id="store" aria-label="POSTGRESQL + CHUNKS + VECTORS"><title>POSTGRESQL + CHUNKS + VECTORS · 提交清理版本、來源、政策及模型鍵；冪等去重保留穩定來源身份，舊不安全向量撤出。</title><rect x="580" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">POSTGRESQL + CHUNKS + VECTORS</tspan></text></g><g data-node-id="coverage" aria-label="RECHECK SUPPORT + CITATIONS"><title>RECHECK SUPPORT + CITATIONS · 清理不能製造證據，支持流失回證據不足；PII 清理不授權工具，也不能移除注入檢查。</title><polygon points="1080,550 1220,606 1080,662 940,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="600">RECHECK SUPPORT +</tspan><tspan x="1080" y="620">CITATIONS</tspan></text></g><g data-node-id="traces" aria-label="LANGFUSE + LANGSMITH"><title>LANGFUSE + LANGSMITH · 兩邊只收到清理運行 spans，分享須用清理 trace 視圖。</title><rect x="1300" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1440" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1440" y="610">LANGFUSE + LANGSMITH</tspan></text></g><g data-node-id="insufficient" aria-label="INSUFFICIENT EVIDENCE → END"><title>INSUFFICIENT EVIDENCE → END · 清理移除了必要支持，不發布受影響結論，說明缺少面向而不暴露已移除值。</title><rect x="580" y="760" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">INSUFFICIENT EVIDENCE → END</tspan></text></g><g data-node-id="release" aria-label="FINAL PRIVACY CHECK → SAVE"><title>FINAL PRIVACY CHECK → SAVE · 報告持久儲存／下載前檢查清理草稿；包含 scope／generate 更新的 checkpoint 只存安全 state。</title><rect x="940" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="820">FINAL PRIVACY CHECK → SAVE</tspan></text></g><g data-node-id="stop" aria-label="PRIVACY BLOCKED / WITHHOLD"><title>PRIVACY BLOCKED / WITHHOLD · 偵測失敗停止該路徑，不回退原文、自動重試、存原 checkpoint 或敏感 error log。</title><rect x="760" y="970" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1030">PRIVACY BLOCKED / WITHHOLD</tspan></text></g><text x="36" y="1128" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
