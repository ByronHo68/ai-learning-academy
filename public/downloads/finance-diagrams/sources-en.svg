<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="1440" height="940" role="img" aria-label="Refresh news through n8n MCP for every prompt" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Refresh news through n8n MCP for every prompt</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="sources-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="sources-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="sources-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="sources-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="sources-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1440" height="940" fill="#fcfcf8"></rect><rect width="1440" height="940" fill="url(#sources-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · SOURCES · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Refresh news through n8n MCP for every prompt</text><g opacity="1"><path d="M 720 242 C 720 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#sources-en-flow)"></path><rect x="636" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="295">Once per new prompt</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 360 501, 360 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#sources-en-flow)"></path><rect x="456" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="505">Valid records</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 720 501, 720 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#sources-en-stop)"></path><rect x="636" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="720" y="505">Provider failed</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 1080 501, 1080 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#sources-en-stop)"></path><rect x="816" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="900" y="505">Only stale evidence</tspan></text></g><g opacity="1"><path d="M 360 662 C 360 711, 720 711, 720 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#sources-en-flow)"></path><rect x="456" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="715">Snapshot ready</tspan></text></g><g data-node-id="Validated request → n8n MCP refresh" aria-label="Validated request → n8n MCP refresh"><title>Validated request → n8n MCP refresh</title><rect x="580" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" s