bel="Insufficient → END"><title>Insufficient → END · 每個提示經範圍檢查、檢索、重排及證據檢查，同時限制執行預算。</title><rect x="580" y="760" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">Insufficient → END</tspan></text></g><g data-node-id="Context → LLM → validation" aria-label="Context → LLM → validation"><title>Context → LLM → validation · 每個提示經範圍檢查、檢索、重排及證據檢查，同時限制執行預算。</title><polygon points="1080,760 1220,816 1080,872 940,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="810">Context → LLM →</tspan><tspan x="1080" y="830">validation</tspan></text></g><g data-node-id="Save → answer" aria-label="Save → answer"><title>Save → answer · 每個提示經範圍檢查、檢索、重排及證據檢查，同時限制執行預算。</title><rect x="220" y="970" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1030">Save → answer</tspan></text></g><g data-node-id="Blocked → END" aria-label="Blocked → END"><title>Blocked → END · 每個提示經範圍檢查、檢索、重排及證據檢查，同時限制執行預算。</title><rect x="580" y="970" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1030">Blocked → END</tspan></text></g><g data-node-id="Unavailable → END" aria-label="Unavailable → END"><title>Unavailable → END · 每個提示經範圍檢查、檢索、重排及證據檢查，同時限制執行預算。</title><rect x="940" y="970" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" 