<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1780" width="1460" height="1780" role="img" aria-label="Embedding → exact/HNSW → fusion → rerank" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Embedding → exact/HNSW → fusion → rerank</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="rerank_hnsw-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="rerank_hnsw-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="rerank_hnsw-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="rerank_hnsw-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="rerank_hnsw-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1460" height="1780" fill="#fcfcf8"></rect><rect width="1460" height="1780" fill="url(#rerank_hnsw-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · RERANK_HNSW · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Embedding → exact/HNSW → fusion → rerank</text><g opacity="1"><path d="M 540 242 C 540 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="366" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="295">Index new versions</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 720 501, 720 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="456" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="497">Ready compatible</tspan><tspan x="540" y="513">vectors</tspan></text></g><g opacity="1"><path d="M 720 662 C 720 711, 720 711, 720 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="636" y="689" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="707">Stored index access</tspan><tspan x="720" y="723">path</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="726" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="295">Admitted hybrid</tspan></text></g><g opacity="1"><path d="M 900 242 C 900 291, 1080 291, 1080 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="906" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="990" y="295">Default / hybrid branch</tspan></text></g><g opacity="1"><path d="M 720 452 V 504 H 1420 V 708 H 720 V 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="1278" y="592" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1362" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1362" y="610">Pinned query vector</tspan></text></g><g opacity="1"><path d="M 720 872 C 720 921, 720 921, 720 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="636" y="899" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="917">Eligible dense</tspan><tspan x="720" y="933">candidates</tspan></text></g><g opacity="1"><path d="M 1080 452 V 490 H 1396 V 932 H 720 V 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="1254" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1338" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1338" y="715">Admitted hybrid only</tspan></text></g><g opacity="1"><path d="M 1080 452 V 504 H 1372 V 1548 H 720 V 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="1230" y="1012" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1314" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1314" y="1030">Default ranking</tspan></text></g><g opacity="1"><path d="M 720 1082 C 720 1131, 720 1131, 720 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="636" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="1135">Shortlist original text</tspan></text></g><g opacity="1"><path d="M 720 1292 V 1330 H 1348 V 1562 H 720 V 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#rerank_hnsw-en-flow)"></path><rect x="1206" y="1432" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1290" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1290" y="1450">Relevance order</tspan></text></g><g opacity="1"><path d="M 720 872 V 924 H 1324 V 1338 H 720 V 1390" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#rerank_hnsw-en-fallback)"></path><rect x="1182" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="1266" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="1266" y="1135">Error / scan shortfall</tspan></text></g><g opacity="1"><path d="M 720 1292 C 720 1341, 720 1341, 720 1390" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#rerank_hnsw-en-fallback)"></path><rect x="636" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="720" y="1345">Operational error</tspan></text></g><g opacity="1"><path d="M 720 1502 C 720 1551, 720 1551, 720 1600" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#rerank_hnsw-en-fallback)"></path><rect x="636" y="1529" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="720" y="1547">Working sparse, same</tspan><tspan x="720" y="1563">budget</tspan></text></g><g data-node-id="ingest" aria-label="SANITIZED COMMITTED CHUNKS"><title>SANITIZED COMMITTED CHUNKS · n8n acquires permitted news. Commit sanitized versions before a separate document embedding worker runs.</title><rect x="400" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">SANITIZED COMMITTED CHUNKS</tspan></text></g><g data-node-id="request" aria-label="SCOPE → REFRESH → SNAPSHOT"><title>SCOPE → REFRESH → SNAPSHOT · After API privacy and scope, refresh once and pin the eligible text/vector-ready view. Independent ingestion continues.</title><polygon points="900,130 1040,186 900,242 760,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="180">SCOPE → REFRESH →</tspan><tspan x="900" y="200">SNAPSHOT</tspan></text></g><g data-node-id="embed" aria-label="E5 DOCUMENT VECTORS + MODEL KEY"><title>E5 DOCUMENT VECTORS + MODEL KEY · Pin 384D model revision, prefixes, normalization, chunking and privacy policy.</title><rect x="220" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="390">E5 DOCUMENT VECTORS + MODEL</tspan><tspan x="360" y="410">KEY</tspan></text></g><g data-node-id="query" aria-label="QUERY EMBEDDING · HYBRID ONLY"><title>QUERY EMBEDDING · HYBRID ONLY · Use compatible E5 configuration. Sparse is the default until frozen admission.</title><rect x="580" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">QUERY EMBEDDING · HYBRID ONLY</tspan></text></g><g data-node-id="sparse" aria-label="POSTGRESQL FULL-TEXT"><title>POSTGRESQL FULL-TEXT · Default path and the sparse branch of admitted hybrid. It needs no embeddings.</title><polygon points="1080,340 1220,396 1080,452 940,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="400">POSTGRESQL FULL-TEXT</tspan></text></g><g data-node-id="index" aria-label="OPTIONAL HNSW COSINE INDEX"><title>OPTIONAL HNSW COSINE INDEX · Build outside user turns. Exact vector search remains the reference; ANN requires measured recall and resource checks.</title><rect x="580" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">OPTIONAL HNSW COSINE INDEX</tspan></text></g><g data-node-id="dense" aria-label="FILTERED EXACT / HNSW SEARCH"><title>FILTERED EXACT / HNSW SEARCH · Keep SQL filters. ANN may yield fewer than k; iterative_scan has caps and strict_order is not exact recall.</title><polygon points="720,760 860,816 720,872 580,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="810">FILTERED EXACT / HNSW</tspan><tspan x="720" y="830">SEARCH</tspan></text></g><g data-node-id="fuse" aria-label="RRF · FUSE TO 20"><title>RRF · FUSE TO 20 · Use up to 20 candidates per branch, deduplicate and fuse ranks. Do not add cosine and neural logits.</title><rect x="580" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1030">RRF · FUSE TO 20</tspan></text></g><g data-node-id="rerank" aria-label="BGE RERANKER CANDIDATE → TOP 10"><title>BGE RERANKER CANDIDATE → TOP 10 · Score sanitized question–passage pairs using a separately pinned model; no stock-impact probability.</title><polygon points="720,1180 860,1236 720,1292 580,1236" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1230">BGE RERANKER CANDIDATE</tspan><tspan x="720" y="1250">→ TOP 10</tspan></text></g><g data-node-id="review" aria-label="REVIEW → GATE → ≤6 EXCERPTS"><title>REVIEW → GATE → ≤6 EXCERPTS · Show source order, allow exclusions/highlights/discussion preference, validate coverage before context and LLM.</title><rect x="580" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1660">REVIEW → GATE → ≤6 EXCERPTS</tspan></text></g><g data-node-id="fallback" aria-label="SPARSE FALLBACK / EXPLICIT FAILURE"><title>SPARSE FALLBACK / EXPLICIT FAILURE · Operational dense/reranker errors may use sparse within budget. Privacy failure stops; PostgreSQL outage affects both.</title><rect x="580" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1440">SPARSE FALLBACK / EXPLICIT</tspan><tspan x="720" y="1460">FAILURE</tspan></text></g><text x="36" y="1758" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
