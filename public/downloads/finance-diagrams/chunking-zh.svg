<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2410" width="1080" height="2410" role="img" aria-label="由 n8n 新聞到可檢索段落" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>由 n8n 新聞到可檢索段落</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="chunking-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="chunking-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="chunking-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="chunking-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="chunking-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="2410" fill="#fcfcf8"></rect><rect width="1080" height="2410" fill="url(#chunking-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · CHUNKING · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">由 n8n 新聞到可檢索段落</text><g opacity="1"><path d="M 540 242 C 540 291, 540 291, 540 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">回應符合位元組上限</tspan></text></g><g opacity="1"><path d="M 540 242 V 280 H 1040 V 512 H 720 V 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#chunking-zh-stop)"></path><rect x="898" y="382" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="982" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="982" y="400">回應超大</tspan></text></g><g opacity="1"><path d="M 540 452 V 504 H 1016 V 708 H 540 V 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="874" y="592" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="958" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="958" y="610">正文符合欄位上限</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 360 501, 360 550" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#chunking-zh-fallback)"></path><rect x="366" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="450" y="505">超長且有可用摘要</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 720 501, 720 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#chunking-zh-stop)"></path><rect x="546" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="505">超長且無可用摘要</tspan></text></g><g opacity="1"><path d="M 360 662 C 360 711, 540 711, 540 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="366" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="715">已記錄摘要覆蓋</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 540 921, 540 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="456" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="925">新版本入列</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 360 1131, 360 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="366" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1135">全文或摘要</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 720 1131, 720 1180" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#chunking-zh-stop)"></path><rect x="546" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="1135">無可用文字</tspan></text></g><g opacity="1"><path d="M 360 1292 C 360 1341, 540 1341, 540 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="366" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1345">確實原文範圍</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="456" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1555">切段後編碼</tspan></text></g><g opacity="1"><path d="M 540 1712 C 540 1761, 540 1761, 540 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="456" y="1747" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1765">提交已完成的一批</tspan></text></g><g opacity="1"><path d="M 540 1922 C 540 1971, 360 1971, 360 2020" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="366" y="1957" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1975">尚有餘下段落</tspan></text></g><g opacity="1"><path d="M 220 2076 H 100 V 1656 H 400" fill="none" stroke="#7251a1" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#chunking-zh-retry)"></path><rect x="16" y="1852" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#7251a1" stroke-opacity=".23"></rect><text x="100" text-anchor="middle" fill="#7251a1" font-size="12" font-weight="600"><tspan x="100" y="1870">下一批處理</tspan></text></g><g opacity="1"><path d="M 540 1502 V 1554 H 992 V 1968 H 720 V 2020" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="850" y="1747" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="934" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="934" y="1765">全文搜尋用已准入原文</tspan></text></g><g opacity="1"><path d="M 540 1922 C 540 1971, 720 1971, 720 2020" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="546" y="1957" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="1975">只限已准入混合</tspan></text></g><g opacity="1"><path d="M 720 2132 C 720 2181, 540 2181, 540 2230" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-zh-flow)"></path><rect x="546" y="2167" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="2185">合資格版本及截止</tspan></text></g><g data-node-id="payload" aria-label="n8n NEWS ARRAY"><title>n8n NEWS ARRAY · 公司流程要求最多三篇 YFinance 文章。每篇獨立處理。</title><polygon points="540,130 680,186 540,242 400,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">n8n NEWS ARRAY</tspan></text></g><g data-node-id="intake" aria-label="CHECK CONTENT SIZE"><title>CHECK CONTENT SIZE · 保留每個 content 欄位 100,000 UTF-16 碼元上限。建議 server 或 bridge 先限制位元組，再對解析後的欄位逐項判斷。</title><polygon points="540,340 680,396 540,452 400,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">CHECK CONTENT SIZE</tspan></text></g><g data-node-id="summary" aria-label="KEEP VALIDATED SUMMARY"><title>KEEP VALIDATED SUMMARY · 長文超限的建議回退。驗證供應商摘要，保存來源欄位、日期及覆蓋減少的原因。</title><rect x="220" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="610">KEEP VALIDATED SUMMARY</tspan></text></g><g data-node-id="skip" aria-label="RECORD ACQUISITION GAP"><title>RECORD ACQUISITION GAP · 傳輸拒絕超大回應。若解析後的超長項目無有效摘要，建議記錄略過，繼續處理合資格項目。</title><rect x="580" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">RECORD ACQUISITION GAP</tspan></text></g><g data-node-id="commit" aria-label="VALIDATE, SANITIZE, COMMIT"><title>VALIDATE, SANITIZE, COMMIT · 去重並保存固定版本至 news_ingest.versions。收據回傳已提交版本 ID。</title><rect x="400" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="820">VALIDATE, SANITIZE, COMMIT</tspan></text></g><g data-node-id="outbox" aria-label="READ COMMITTED VERSION"><title>READ COMMITTED VERSION · 建議的索引 worker 根據 embedding_outbox 待處理記錄讀取清理後來源欄位。</title><polygon points="540,970 680,1026 540,1082 400,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1030">READ COMMITTED VERSION</tspan></text></g><g data-node-id="split" aria-label="TOKENIZE AND SPLIT"><title>TOKENIZE AND SPLIT · 不跨文章切段。優先在目標附近的段落或句尾切開，再檢查完整模型輸入。</title><rect x="220" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1240">TOKENIZE AND SPLIT</tspan></text></g><g data-node-id="empty" aria-label="RECORD MISSING TEXT"><title>RECORD MISSING TEXT · content 及 summary 都沒有文字，就記錄缺口並跳過編碼。</title><rect x="580" y="1180" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1240">RECORD MISSING TEXT</tspan></text></g><g data-node-id="metadata" aria-label="WRITE CHUNK METADATA"><title>WRITE CHUNK METADATA · 保存版本、來源欄位、確實範圍、次序、策略、雜湊及 token 數。</title><polygon points="540,1390 680,1446 540,1502 400,1446" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">WRITE CHUNK METADATA</tspan></text></g><g data-node-id="embed" aria-label="ENCODE E5 BATCH"><title>ENCODE E5 BATCH · 每段計前綴後檢查模型上限。建議 worker 每篇每批最多處理 32 段，亦可在時間預算前停止。</title><rect x="400" y="1600" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">ENCODE E5 BATCH</tspan></text></g><g data-node-id="ready" aria-label="SAVE VECTORS AND PROGRESS"><title>SAVE VECTORS AND PROGRESS · 依段落及 embedding 設定作冪等寫入，保存已就緒及計劃段數。所有預期記錄提交後才標記 outbox 完成。</title><polygon points="540,1810 680,1866 540,1922 400,1866" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1860">SAVE VECTORS AND</tspan><tspan x="540" y="1880">PROGRESS</tspan></text></g><g data-node-id="queue" aria-label="QUEUE REMAINING CHUNKS"><title>QUEUE REMAINING CHUNKS · 使用相同文章版本及模型設定，從已存索引進度繼續。新就緒向量供之後的快照使用。</title><rect x="220" y="2020" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="2080">QUEUE REMAINING CHUNKS</tspan></text></g><g data-node-id="snapshot" aria-label="PIN RETRIEVAL SNAPSHOT"><title>PIN RETRIEVAL SNAPSHOT · 報告 host 接納合資格版本，固定設定及已就緒向量。混合評估獲准前預設全文。</title><rect x="580" y="2020" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="2080">PIN RETRIEVAL SNAPSHOT</tspan></text></g><g data-node-id="retrieve" aria-label="SEARCH, RERANK, CITE"><title>SEARCH, RERANK, CITE · 在截止與權限內檢索；已准入混合模式可重排。按版本組合重疊命中，遵守讀取及 context 預算，並報告覆蓋缺口。</title><rect x="400" y="2230" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="2290">SEARCH, RERANK, CITE</tspan></text></g><text x="36" y="2388" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
