server.port=${BANK_PORT:8081}
server.address=${BANK_BIND:127.0.0.1}
spring.application.name=academy-bank
spring.datasource.url=${BANK_DB_URL:jdbc:h2:file:./data/bank}
spring.datasource.username=sa
spring.datasource.password=
spring.ai.mcp.server.name=academy-bank
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.tool-change-notification=false
spring.main.banner-mode=off
logging.level.root=WARN
bank.token=${BANK_API_TOKEN}
bank.approval-secret=${BANK_APPROVAL_SECRET}
