<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1360" width="1440" height="1360" role="img" aria-label="Choose the data and render the report" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Choose the data and render the report</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="report_story-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="report_story-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="report_story-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="report_story-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="report_story-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1440" height="1360" fill="#fcfcf8"></rect><rect width="1440" height="1360" fill="url(#report_story-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · REPORT_STORY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Choose the data and render the report</text><g opacity="1"><path d="M 720 242 C 720 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="456" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="295">Company research</tspan></text></g><g opacity="1"><path d="M 720 242 C 720 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="636" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="295">Price only (proposed)</tspan></text></g><g opacity="1"><path d="M 720 242 C 720 291, 1080 291, 1080 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="816" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="295">Chart only (proposed)</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="366" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="505">Evidence sufficient</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 900 501, 900 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#report_story-en-stop)"></path><rect x="546" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="497">Evidence still</tspan><tspan x="630" y="513">insufficient</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 720 711, 720 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="546" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="715">Sanitized JSON</tspan></text></g><g opacity="1"><path d="M 720 872 C 720 921, 720 921, 720 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="636" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="925">Draft and source IDs</tspan></text></g><g opacity="1"><path d="M 720 1082 C 720 1131, 720 1131, 720 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="636" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="1135">Validated report</tspan></text></g><g opacity="1"><path d="M 720 452 V 504 H 1400 V 1128 H 720 V 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="1258" y="802" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1342" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1342" y="820">Dated observation</tspan></text></g><g opacity="1"><path d="M 1080 452 V 476 H 1376 V 1156 H 720 V 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#report_story-en-flow)"></path><rect x="1234" y="802" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1318" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1318" y="820">Ordered observations</tspan></text></g><g data-node-id="scope" aria-label="ROUTE QUESTION"><title>ROUTE QUESTION · Check the company and identify the information you need. The project’s report path accepts supported company-research questions. Quote-only and chart-only routes are proposed extensions.</title><polygon points="720,130 860,186 720,242 580,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="190">ROUTE QUESTION</tspan></text></g><g data-node-id="evidence" aria-label="REVIEW EVIDENCE"><title>REVIEW EVIDENCE · Retrieve relevant passages from the approved n8n evidence. Rerank where enabled, let the user review the selection when requested, and verify coverage before calling the report model.</title><polygon points="360,340 500,396 360,452 220,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="400">REVIEW EVIDENCE</tspan></text></g><g data-node-id="quote" aria-label="VALIDATE QUOTE"><title>VALIDATE QUOTE · The proposed quote route uses the YFinance quote response. Display the amount, currency, price basis, market time, fetch time, and available session information. If delay is unknown, label it as unknown.</title><rect x="580" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">VALIDATE QUOTE</tspan></text></g><g data-node-id="history" aria-label="VALIDATE PRICE HISTORY"><title>VALIDATE PRICE HISTORY · The proposed history route needs a dedicated data tool. Validate the date window, order, currency, interval, adjustment basis, and missing rows. Compute changes from that series in code and use it to draw the chart.</title><rect x="940" y="340" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="400">VALIDATE PRICE HISTORY</tspan></text></g><g data-node-id="context" aria-label="BUILD CONTEXT"><title>BUILD CONTEXT · Send the question and approved excerpts as JSON. The current gateway accepts source ID, excerpt, and publication time for each source. The app keeps citation URLs, numeric quote data, and chart inputs separately.</title><rect x="400" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="610">BUILD CONTEXT</tspan></text></g><g data-node-id="gap" aria-label="SHOW EVIDENCE GAP"><title>SHOW EVIDENCE GAP · Explain which evidence is missing and return an insufficient-evidence outcome.</title><rect x="760" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="610">SHOW EVIDENCE GAP</tspan></text></g><g data-node-id="generate" aria-label="GENERATE JSON DRAFT"><title>GENERATE JSON DRAFT · Call the chat completions endpoint with the report system prompt, the context JSON, and a strict response schema. The draft contains an answer, facts, supported conditional scenarios, and limitations.</title><rect x="580" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">GENERATE JSON DRAFT</tspan></text></g><g data-node-id="validate" aria-label="VALIDATE AND SAVE"><title>VALIDATE AND SAVE · Validate the JSON and require every cited ID to resolve to the saved evidence. Check that the quoted text supports each material claim. Save the passed report and citation links together.</title><rect x="580" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1030">VALIDATE AND SAVE</tspan></text></g><g data-node-id="render" aria-label="RENDER RESULT"><title>RENDER RESULT · Display the validated output in the web view. For a research report, create a Markdown download or a printable PDF from the same saved report. For market-only requests, render directly from the validated observations.</title><rect x="580" y="1180" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1240">RENDER RESULT</tspan></text></g><text x="36" y="1338" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
