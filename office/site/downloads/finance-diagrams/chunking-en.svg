<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2410" width="1080" height="2410" role="img" aria-label="From n8n news to searchable passages" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>From n8n news to searchable passages</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="chunking-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="chunking-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="chunking-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="chunking-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="chunking-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1080" height="2410" fill="#fcfcf8"></rect><rect width="1080" height="2410" fill="url(#chunking-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · CHUNKING · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">From n8n news to searchable passages</text><g opacity="1"><path d="M 540 242 C 540 291, 540 291, 540 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="269" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="287">Response within byte</tspan><tspan x="540" y="303">limit</tspan></text></g><g opacity="1"><path d="M 540 242 V 280 H 1040 V 512 H 720 V 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#chunking-en-stop)"></path><rect x="898" y="382" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="982" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="982" y="400">Response too large</tspan></text></g><g opacity="1"><path d="M 540 452 V 504 H 1016 V 708 H 540 V 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="874" y="584" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="958" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="958" y="602">Content within field</tspan><tspan x="958" y="618">limit</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 360 501, 360 550" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#chunking-en-fallback)"></path><rect x="366" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="450" y="497">Oversized + usable</tspan><tspan x="450" y="513">summary</tspan></text></g><g opacity="1"><path d="M 540 452 C 540 501, 720 501, 720 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#chunking-en-stop)"></path><rect x="546" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="497">Oversized + no usable</tspan><tspan x="630" y="513">summary</tspan></text></g><g opacity="1"><path d="M 360 662 C 360 711, 540 711, 540 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="366" y="689" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="707">Summary coverage</tspan><tspan x="450" y="723">recorded</tspan></text></g><g opacity="1"><path d="M 540 872 C 540 921, 540 921, 540 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="925">New version queued</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 360 1131, 360 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="366" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1135">Content or summary</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 720 1131, 720 1180" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#chunking-en-stop)"></path><rect x="546" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="630" y="1135">No usable text</tspan></text></g><g opacity="1"><path d="M 360 1292 C 360 1341, 540 1341, 540 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="366" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1345">Exact text slices</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1555">After chunk creation</tspan></text></g><g opacity="1"><path d="M 540 1712 C 540 1761, 540 1761, 540 1810" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="456" y="1747" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1765">Commit completed batch</tspan></text></g><g opacity="1"><path d="M 540 1922 C 540 1971, 360 1971, 360 2020" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="366" y="1957" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="1975">Chunks remain</tspan></text></g><g opacity="1"><path d="M 220 2076 H 100 V 1656 H 400" fill="none" stroke="#7251a1" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#chunking-en-retry)"></path><rect x="16" y="1852" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#7251a1" stroke-opacity=".23"></rect><text x="100" text-anchor="middle" fill="#7251a1" font-size="12" font-weight="600"><tspan x="100" y="1870">Next worker batch</tspan></text></g><g opacity="1"><path d="M 540 1502 V 1554 H 992 V 1968 H 720 V 2020" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="850" y="1739" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="934" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="934" y="1757">Sparse search uses</tspan><tspan x="934" y="1773">admitted text</tspan></text></g><g opacity="1"><path d="M 540 1922 C 540 1971, 720 1971, 720 2020" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="546" y="1957" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="1975">Admitted hybrid only</tspan></text></g><g opacity="1"><path d="M 720 2132 C 720 2181, 540 2181, 540 2230" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#chunking-en-flow)"></path><rect x="546" y="2159" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="2177">Eligible versions and</tspan><tspan x="630" y="2193">cutoff</tspan></text></g><g data-node-id="payload" aria-label="n8n NEWS ARRAY"><title>n8n NEWS ARRAY · The company flow requests up to three YFinance articles. Treat each item as a separate document.</title><polygon points="540,130 680,186 540,242 400,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="190">n8n NEWS ARRAY</tspan></text></g><g data-node-id="intake" aria-label="CHECK CONTENT SIZE"><title>CHECK CONTENT SIZE · Keep the existing 100,000 UTF-16 units per content field. The proposed server or bridge byte cap acts before parsing, and the proposed item policy evaluates each parsed field.</title><polygon points="540,340 680,396 540,452 400,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="400">CHECK CONTENT SIZE</tspan></text></g><g data-node-id="summary" aria-label="KEEP VALIDATED SUMMARY"><title>KEEP VALIDATED SUMMARY · Proposed fallback for oversized article text. Validate the provider summary and store its source field, timestamps and reason for reduced coverage.</title><rect x="220" y="550" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="610">KEEP VALIDATED SUMMARY</tspan></text></g><g data-node-id="skip" aria-label="RECORD ACQUISITION GAP"><title>RECORD ACQUISITION GAP · An oversized response is rejected at transport. For a parsed oversized item without a valid summary, the proposed policy records a skip and keeps processing eligible items.</title><rect x="580" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">RECORD ACQUISITION GAP</tspan></text></g><g data-node-id="commit" aria-label="VALIDATE, SANITIZE, COMMIT"><title>VALIDATE, SANITIZE, COMMIT · Deduplicate and store immutable versions in news_ingest.versions. The receipt returns committed version IDs.</title><rect x="400" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="820">VALIDATE, SANITIZE, COMMIT</tspan></text></g><g data-node-id="outbox" aria-label="READ COMMITTED VERSION"><title>READ COMMITTED VERSION · The proposed indexing worker follows a pending embedding_outbox entry to the sanitized source field.</title><polygon points="540,970 680,1026 540,1082 400,1026" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1030">READ COMMITTED VERSION</tspan></text></g><g data-node-id="split" aria-label="TOKENIZE AND SPLIT"><title>TOKENIZE AND SPLIT · Keep each chunk within one article. Prefer paragraphs or sentences near the target and validate the full model input.</title><rect x="220" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="1240">TOKENIZE AND SPLIT</tspan></text></g><g data-node-id="empty" aria-label="RECORD MISSING TEXT"><title>RECORD MISSING TEXT · If both content and summary are blank, record the gap and skip encoding.</title><rect x="580" y="1180" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="1240">RECORD MISSING TEXT</tspan></text></g><g data-node-id="metadata" aria-label="WRITE CHUNK METADATA"><title>WRITE CHUNK METADATA · Persist the version, source field, exact offsets, chunk order, policy, hash and token count.</title><polygon points="540,1390 680,1446 540,1502 400,1446" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">WRITE CHUNK METADATA</tspan></text></g><g data-node-id="embed" aria-label="ENCODE E5 BATCH"><title>ENCODE E5 BATCH · Check every prefixed passage against the model limit. The proposed worker processes at most 32 chunks per article in one batch and can stop earlier at its time budget.</title><rect x="400" y="1600" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">ENCODE E5 BATCH</tspan></text></g><g data-node-id="ready" aria-label="SAVE VECTORS AND PROGRESS"><title>SAVE VECTORS AND PROGRESS · Use idempotent writes keyed by chunk and embedding configuration. Save ready and planned counts. Mark the outbox complete only after all expected rows commit.</title><polygon points="540,1810 680,1866 540,1922 400,1866" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1860">SAVE VECTORS AND</tspan><tspan x="540" y="1880">PROGRESS</tspan></text></g><g data-node-id="queue" aria-label="QUEUE REMAINING CHUNKS"><title>QUEUE REMAINING CHUNKS · Resume from saved indexing progress with the same article version and model configuration. Newly ready vectors belong to later snapshots.</title><rect x="220" y="2020" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="2080">QUEUE REMAINING CHUNKS</tspan></text></g><g data-node-id="snapshot" aria-label="PIN RETRIEVAL SNAPSHOT"><title>PIN RETRIEVAL SNAPSHOT · The report host admits eligible versions and pins the configuration and ready vector set. Sparse remains the default until evaluated hybrid admission.</title><rect x="580" y="2020" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="2080">PIN RETRIEVAL SNAPSHOT</tspan></text></g><g data-node-id="retrieve" aria-label="SEARCH, RERANK, CITE"><title>SEARCH, RERANK, CITE · Retrieve permitted passages within the cutoff and rerank in admitted hybrid. Group overlapping hits by version, stay within the source-read and context budgets, and report any coverage gaps.</title><rect x="400" y="2230" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="2290">SEARCH, RERANK, CITE</tspan></text></g><text x="36" y="2388" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
