<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1148 1780" width="1148" height="1780" role="img" aria-label="Where document and question embeddings happen" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Where document and question embeddings happen</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="embeddings-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="embeddings-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="embeddings-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="embeddings-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="embeddings-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1148" height="1780" fill="#fcfcf8"></rect><rect width="1148" height="1780" fill="url(#embeddings-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · EMBEDDINGS · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Where document and question embeddings happen</text><g opacity="1"><path d="M 360 242 C 360 291, 360 291, 360 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="276" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="360" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="360" y="295">Indexing pipeline</tspan></text></g><g opacity="1"><path d="M 360 242 V 280 H 1108 V 722 H 720 V 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="966" y="479" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1050" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1050" y="497">Committed text + FTS</tspan><tspan x="1050" y="513">index</tspan></text></g><g opacity="1"><path d="M 360 452 C 360 501, 540 501, 540 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="366" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="505">New / changed hash</tspan></text></g><g opacity="1"><path d="M 360 452 V 476 H 1084 V 736 H 360 V 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="942" y="584" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1026" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1026" y="602">Matching hash + model</tspan><tspan x="1026" y="618">cached</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 360 711, 360 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="366" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="715">Persist ready vectors</tspan></text></g><g opacity="1"><path d="M 540 662 C 540 711, 720 711, 720 760" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#embeddings-en-fallback)"></path><rect x="546" y="689" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="630" y="707">Pending / failed; no</tspan><tspan x="630" y="723">blocking</tspan></text></g><g opacity="1"><path d="M 720 242 C 720 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="636" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="295">Admitted hybrid only</tspan></text></g><g opacity="1"><path d="M 720 242 V 280 H 1060 V 722 H 720 V 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="918" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="1002" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="1002" y="505">Default full-text</tspan></text></g><g opacity="1"><path d="M 720 452 V 504 H 1036 V 918 H 540 V 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="894" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="978" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="978" y="715">Query vector ready</tspan></text></g><g opacity="1"><path d="M 720 452 V 476 H 1012 V 736 H 720 V 760" fill="none" stroke="#9b641b" stroke-width="2" marker-end="url(#embeddings-en-fallback)"></path><rect x="870" y="592" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#9b641b" stroke-opacity=".23"></rect><text x="954" text-anchor="middle" fill="#9b641b" font-size="12" font-weight="600"><tspan x="954" y="610">Embedding failure</tspan></text></g><g opacity="1"><path d="M 360 872 C 360 921, 540 921, 540 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="366" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="450" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="450" y="925">Eligible indexed chunks</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 540 1131, 540 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="456" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1135">Dense candidates</tspan></text></g><g opacity="1"><path d="M 720 872 V 896 H 988 V 1156 H 540 V 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="846" y="1012" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="930" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="930" y="1030">Hybrid sparse branch</tspan></text></g><g opacity="1"><path d="M 720 872 V 910 H 964 V 1352 H 540 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="822" y="1109" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="906" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="906" y="1127">Default / fallback</tspan><tspan x="906" y="1143">ranking</tspan></text></g><g opacity="1"><path d="M 540 1292 C 540 1341, 540 1341, 540 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="456" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1345">Reranked passages</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-en-flow)"></path><rect x="456" y="1529" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1547">Validated selection</tspan><tspan x="540" y="1563">revision</tspan></text></g><g data-node-id="news" aria-label="COMMITTED NEWS + PROFILES"><title>COMMITTED NEWS + PROFILES · YFinance company news, Alpha Vantage daily batches and sourced profile versions are committed before indexing.</title><polygon points="360,130 500,186 360,242 220,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="180">COMMITTED NEWS +</tspan><tspan x="360" y="200">PROFILES</tspan></text></g><g data-node-id="question" aria-label="REFRESH → SNAPSHOT → QUERY"><title>REFRESH → SNAPSHOT → QUERY · The original question and fixed evidence snapshot constrain all retrieval paths.</title><polygon points="720,130 860,186 720,242 580,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="180">REFRESH → SNAPSHOT →</tspan><tspan x="720" y="200">QUERY</tspan></text></g><g data-node-id="chunks" aria-label="CHUNK + HASH + VERSION"><title>CHUNK + HASH + VERSION · Use permitted text, source IDs and dates. Only changed text/model combinations require new vectors.</title><polygon points="360,340 500,396 360,452 220,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="400">CHUNK + HASH + VERSION</tspan></text></g><g data-node-id="query_embed" aria-label="QUERY EMBEDDING"><title>QUERY EMBEDDING · Hybrid only: encode this query using the compatible pinned model. A refinement encodes its new query.</title><polygon points="720,340 860,396 720,452 580,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">QUERY EMBEDDING</tspan></text></g><g data-node-id="document_embed" aria-label="DOCUMENT EMBEDDING WORKER"><title>DOCUMENT EMBEDDING WORKER · Separate indexing job using the pinned model/version and compatible dimension; not a per-user LLM call.</title><polygon points="540,550 680,606 540,662 400,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="600">DOCUMENT EMBEDDING</tspan><tspan x="540" y="620">WORKER</tspan></text></g><g data-node-id="vectors" aria-label="POSTGRESQL pgvector + STATUS"><title>POSTGRESQL pgvector + STATUS · Store chunk ID, hash, model and readiness. Reuse existing vectors only when hash and model match.</title><rect x="220" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="820">POSTGRESQL pgvector + STATUS</tspan></text></g><g data-node-id="sparse" aria-label="POSTGRESQL FULL-TEXT"><title>POSTGRESQL FULL-TEXT · Default retrieval needs no embedding. It also supplies the sparse branch of admitted hybrid search.</title><polygon points="720,760 860,816 720,872 580,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">POSTGRESQL FULL-TEXT</tspan></text></g><g data-node-id="dense" aria-label="FILTERED VECTOR SEARCH"><title>FILTERED VECTOR SEARCH · Use ready vectors from this snapshot with the same model, time and permission filters.</title><rect x="400" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1030">FILTERED VECTOR SEARCH</tspan></text></g><g data-node-id="fuse" aria-label="HYBRID FUSION + RERANK"><title>HYBRID FUSION + RERANK · Fuse sparse/dense candidates and rescore question–passage relevance after frozen admission gates pass.</title><rect x="400" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1240">HYBRID FUSION + RERANK</tspan></text></g><g data-node-id="review" aria-label="REVIEW SOURCES + USER ORDER"><title>REVIEW SOURCES + USER ORDER · Show the system rank beside user order. Exclusion never deletes stored news or changes model scores.</title><rect x="400" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">REVIEW SOURCES + USER ORDER</tspan></text></g><g data-node-id="gate" aria-label="COVERAGE → CONTEXT → LLM"><title>COVERAGE → CONTEXT → LLM · Validate selected IDs/order, recheck support after exclusions/trimming, then generate and validate citations.</title><rect x="400" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">COVERAGE → CONTEXT → LLM</tspan></text></g><text x="36" y="1758" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
