<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1360" width="1800" height="1360" role="img" aria-label="Recover a failed run or resume a review" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>Recover a failed run or resume a review</title><desc>Design diagram, not a live run. Purple dashed arrows show bounded retry, amber shows fallback, and red shows stop paths.</desc><defs><pattern id="checkpoint_recovery-en-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="checkpoint_recovery-en-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="checkpoint_recovery-en-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="checkpoint_recovery-en-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="checkpoint_recovery-en-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1800" height="1360" fill="#fcfcf8"></rect><rect width="1800" height="1360" fill="url(#checkpoint_recovery-en-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · CHECKPOINT_RECOVERY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">Recover a failed run or resume a review</text><g opacity="1"><path d="M 900 242 C 900 291, 900 291, 900 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_recovery-en-flow)"></path><rect x="816" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="295">Owner / thread verified</tspan></text></g><g opacity="1"><path d="M 900 242 V 280 H 1760 V 722 H 1440 V 760" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#checkpoint_recovery-en-stop)"></path><rect x="1618" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1702" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1702" y="505">Unauthorized</tspan></text></g><g opacity="1"><path d="M 900 452 C 900 501, 900 501, 900 550" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_recovery-en-flow)"></path><rect x="816" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="505">Checkpoint found</tspan></text></g><g opacity="1"><path d="M 900 452 V 476 H 1736 V 736 H 1440 V 760" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#checkpoint_recovery-en-stop)"></path><rect x="1594" y="584" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1678" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1678" y="602">Missing / storage</tspan><tspan x="1678" y="618">unavailable</tspan></text></g><g opacity="1"><path d="M 900 662 C 900 711, 1440 711, 1440 760" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#checkpoint_recovery-en-stop)"></path><rect x="1086" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="1170" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="1170" y="715">Invalid / expired</tspan></text></g><g opacity="1"><path d="M 900 662 C 900 711, 360 711, 360 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_recovery-en-flow)"></path><rect x="546" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="715">Waiting for selection</tspan></text></g><g opacity="1"><path d="M 900 662 C 900 711, 720 711, 720 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_recovery-en-flow)"></path><rect x="726" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="715">Recoverable failure</tspan></text></g><g opacity="1"><path d="M 900 662 C 900 711, 1080 711, 1080 760" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_recovery-en-flow)"></path><rect x="906" y="697" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="990" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="990" y="715">Saved report exists</tspan></text></g><g opacity="1"><path d="M 360 872 C 360 921, 900 921, 900 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_recovery-en-flow)"></path><rect x="546" y="899" width="168" height="44" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="630" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="630" y="917">Validated resume</tspan><tspan x="630" y="933">payload</tspan></text></g><g opacity="1"><path d="M 720 872 C 720 921, 900 921, 900 970" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_recovery-en-flow)"></path><rect x="726" y="907" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="810" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="810" y="925">Safe continuation</tspan></text></g><g opacity="1"><path d="M 900 1082 C 900 1131, 900 1131, 900 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#checkpoint_recovery-en-flow)"></path><rect x="816" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="900" y="1135">Within original limits</tspan></text></g><g data-node-id="request" aria-label="API: AUTHENTICATE OWNER"><title>API: AUTHENTICATE OWNER · The client does not choose arbitrary thread state or another owner’s ID.</title><polygon points="900,130 1040,186 900,242 760,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="180">API: AUTHENTICATE</tspan><tspan x="900" y="200">OWNER</tspan></text></g><g data-node-id="load" aria-label="LOAD LATEST AUTHORIZED CHECKPOINT"><title>LOAD LATEST AUTHORIZED CHECKPOINT · Resolve run → thread and use the saver to inspect saved progress.</title><polygon points="900,340 1040,396 900,452 760,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="390">LOAD LATEST AUTHORIZED</tspan><tspan x="900" y="410">CHECKPOINT</tspan></text></g><g data-node-id="check" aria-label="STATUS + BUDGET + EXPIRY"><title>STATUS + BUDGET + EXPIRY · Check model/code compatibility, current permissions, remaining active budget and review expiry.</title><polygon points="900,550 1040,606 900,662 760,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="600">STATUS + BUDGET +</tspan><tspan x="900" y="620">EXPIRY</tspan></text></g><g data-node-id="review" aria-label="PENDING REVIEW: Command(resume=...)"><title>PENDING REVIEW: Command(resume=...) · Validate and atomically save source selection revision, then re-enter the interrupted review node.</title><rect x="220" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="810">PENDING REVIEW:</tspan><tspan x="360" y="830">Command(resume=...)</tspan></text></g><g data-node-id="failed" aria-label="FAILED NODE: ainvoke(None, config)"><title>FAILED NODE: ainvoke(None, config) · Continue unfinished work; if refresh was uncheckpointed, reconcile its external receipt first.</title><rect x="580" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="810">FAILED NODE: ainvoke(None,</tspan><tspan x="720" y="830">config)</tspan></text></g><g data-node-id="done" aria-label="ALREADY COMPLETE → RETURN REPORT"><title>ALREADY COMPLETE → RETURN REPORT · Return the saved result without another generation.</title><rect x="940" y="760" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="810">ALREADY COMPLETE → RETURN</tspan><tspan x="1080" y="830">REPORT</tspan></text></g><g data-node-id="stop" aria-label="REJECT / EXPIRED / MISSING → END"><title>REJECT / EXPIRED / MISSING → END · Explain the failed authorization, expired budget or unavailable checkpoint. Do not silently create a fresh run.</title><rect x="1300" y="760" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1440" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1440" y="810">REJECT / EXPIRED / MISSING →</tspan><tspan x="1440" y="830">END</tspan></text></g><g data-node-id="continue" aria-label="REUSE COMPLETED WORK"><title>REUSE COMPLETED WORK · Keep the original snapshot, counters and remaining budget; validate again before release.</title><rect x="760" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1030">REUSE COMPLETED WORK</tspan></text></g><g data-node-id="save" aria-label="NEW CHECKPOINT / NEXT STEP"><title>NEW CHECKPOINT / NEXT STEP · The saver writes the updated progress; original evidence and previous history stay identifiable.</title><rect x="760" y="1180" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="900" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="900" y="1240">NEW CHECKPOINT / NEXT STEP</tspan></text></g><text x="36" y="1338" font-size="11" fill="#536b72">Teaching design · retries preserve remaining active budget and counters · review wait has a separate absolute expiry</text></svg>
