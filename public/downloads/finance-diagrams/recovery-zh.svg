<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 730" width="1440" height="730" role="img" aria-label="恢復中斷研究任務" style="font-family:Arial, &quot;Noto Sans TC&quot;, sans-serif;display:block;max-width:100%;height:auto"><title>恢復中斷研究任務</title><desc>設計圖，並非真實執行。紫色虛線是有限補查；棕色是回退；紅色是停止。</desc><defs><pattern id="recovery-zh-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4df"></circle></pattern><marker id="recovery-zh-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f78"></path></marker><marker id="recovery-zh-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7251a1"></path></marker><marker id="recovery-zh-fallback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9b641b"></path></marker><marker id="recovery-zh-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b64a4a"></path></marker></defs><rect width="1440" height="730" fill="#fcfcf8"></rect><rect width="1440" height="730" fill="url(#recovery-zh-grid)"></rect><text x="36" y="37" fill="#087f78" font-size="12" letter-spacing="2">STOCK RESEARCH · RECOVERY · DESIGN</text><text x="36" y="72" fill="#082c38" font-size="25" font-weight="700">恢復中斷研究任務</text><g opacity="1"><path d="M 720 242 C 720 291, 720 291, 720 340" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#recovery-zh-flow)"></path><rect x="636" y="277" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="720" y="295">相同擁有者／任務</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 360 501, 360 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#recovery-zh-stop)"></path><rect x="456" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="540" y="505">狀態不安全</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 720 501, 720 550" fill="none" stroke="#7251a1" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#recovery-zh-retry)"></path><rect x="636" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#7251a1" stroke-opacity=".23"></rect><text x="720" text-anchor="middle" fill="#7251a1" font-size="12" font-weight="600"><tspan x="720" y="505">原預算恢復</tspan></text></g><g opacity="1"><path d="M 720 452 C 720 501, 1080 501, 1080 550" fill="none" stroke="#b64a4a" stroke-width="2" marker-end="url(#recovery-zh-stop)"></path><rect x="816" y="487" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#b64a4a" stroke-opacity=".23"></rect><text x="900" text-anchor="middle" fill="#b64a4a" font-size="12" font-weight="600"><tspan x="900" y="505">已過期</tspan></text></g><g data-node-id="run_id → authenticate" aria-label="run_id → authenticate"><title>run_id → authenticate</title><rect x="580" y="130" width="280" height="112" rx="38" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="190">run_id → authenticate</tspan></text></g><g data-node-id="PostgreSQL checkpoint" aria-label="PostgreSQL checkpoint"><title>PostgreSQL checkpoint</title><polygon points="720,340 860,396 720,452 580,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">PostgreSQL checkpoint</tspan></text></g><g data-node-id="404 / 409 → END" aria-label="404 / 409 → END"><title>404 / 409 → END</title><rect x="220" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="610">404 / 409 → END</tspan></text></g><g data-node-id="Next unfinished node" aria-label="Next unfinished node"><title>Next unfinished node</title><rect x="580" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="610">Next unfinished node</tspan></text></g><g data-node-id="Stopped → END" aria-label="Stopped → END"><title>Stopped → END</title><rect x="940" y="550" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="1080" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="1080" y="610">Stopped → END</tspan></text></g><text x="36" y="708" font-size="11" fill="#536b72">虛構教學設計 · 原截止及預算適用於所有重試 · 節點技術名稱保留英文</text></svg>
