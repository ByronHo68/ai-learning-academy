tspan x="450" y="925">合資格已索引段落</tspan></text></g><g opacity="1"><path d="M 540 1082 C 540 1131, 540 1131, 540 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-zh-flow)"></path><rect x="456" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1135">向量候選</tspan></text></g><g opacity="1"><path d="M 720 872 V 896 H 988 V 1156 H 540 V 1180" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-zh-flow)"></path><rect x="846" y="1012" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="930" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="930" y="1030">混合的稀疏分支</tspan></text></g><g opacity="1"><path d="M 720 872 V 910 H 964 V 1352 H 540 V 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-zh-flow)"></path><rect x="822" y="1117" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="906" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="906" y="1135">預設／回退排序</tspan></text></g><g opacity="1"><path d="M 540 1292 C 540 1341, 540 1341, 540 1390" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-zh-flow)"></path><rect x="456" y="1327" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1345">已重排原文</tspan></text></g><g opacity="1"><path d="M 540 1502 C 540 1551, 540 1551, 540 1600" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#embeddings-zh-flow)"></path><rect x="456" y="1537" width="168" height="28" rx="7" fill="#fcfcf8" stroke="#087f78" stroke-opacity=".23"></rect><text x="540" text-anchor="middle" fill="#087f78" font-size="12" font-weight="600"><tspan x="540" y="1555">已驗證選取版本</tspan></text></g><g data-node-id="news" aria-label="COMMITTED NEWS + PROFILES"><title>COMMITTED NEWS + PROFILES · YFinance 公司新聞、Alpha Vantage 每日批次及附來源背景先提交，再建立索引。</title><polygon points="360,130 500,186 360,242 220,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="180">COMMITTED NEWS +</tspan><tspan x="360" y="200">PROFILES</tspan></text></g><g data-node-id="question" aria-label="REFRESH → SNAPSHOT → QUERY"><title>REFRESH → SNAPSHOT → QUERY · 原問題及固定快照限制所有檢索路徑。</title><polygon points="720,130 860,186 720,242 580,186" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="180">REFRESH → SNAPSHOT →</tspan><tspan x="720" y="200">QUERY</tspan></text></g><g data-node-id="chunks" aria-label="CHUNK + HASH + VERSION"><title>CHUNK + HASH + VERSION · 用允許文字、來源 ID 及日期；只有文字／模型組合變更才需新向量。</title><polygon points="360,340 500,396 360,452 220,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="400">CHUNK + HASH + VERSION</tspan></text></g><g data-node-id="query_embed" aria-label="QUERY EMBEDDING"><title>QUERY EMBEDDING · 只限混合模式：用相容固定模型編碼本次查詢；補查的新 query 再編碼。</title><polygon points="720,340 860,396 720,452 580,396" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="400">QUERY EMBEDDING</tspan></text></g><g data-node-id="document_embed" aria-label="DOCUMENT EMBEDDING WORKER"><title>DOCUMENT EMBEDDING WORKER · 獨立索引工作，用固定模型／版本及相容維度，不是每用戶的 LLM 生成呼叫。</title><polygon points="540,550 680,606 540,662 400,606" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="600">DOCUMENT EMBEDDING</tspan><tspan x="540" y="620">WORKER</tspan></text></g><g data-node-id="vectors" aria-label="POSTGRESQL pgvector + STATUS"><title>POSTGRESQL pgvector + STATUS · 存段落 ID、hash、模型及就緒狀態；只有 hash 和模型相同才重用向量。</title><rect x="220" y="760" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="360" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="360" y="820">POSTGRESQL pgvector + STATUS</tspan></text></g><g data-node-id="sparse" aria-label="POSTGRESQL FULL-TEXT"><title>POSTGRESQL FULL-TEXT · 預設檢索毋須 embedding，亦供已准入混合模式的稀疏分支。</title><polygon points="720,760 860,816 720,872 580,816" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></polygon><text x="720" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="720" y="820">POSTGRESQL FULL-TEXT</tspan></text></g><g data-node-id="dense" aria-label="FILTERED VECTOR SEARCH"><title>FILTERED VECTOR SEARCH · 只用本快照已就緒向量及相同模型、時間、權限條件。</title><rect x="400" y="970" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1030">FILTERED VECTOR SEARCH</tspan></text></g><g data-node-id="fuse" aria-label="HYBRID FUSION + RERANK"><title>HYBRID FUSION + RERANK · 通過凍結准入後融合稀疏／向量候選，再評問題與原文相關性。</title><rect x="400" y="1180" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1240">HYBRID FUSION + RERANK</tspan></text></g><g data-node-id="review" aria-label="REVIEW SOURCES + USER ORDER"><title>REVIEW SOURCES + USER ORDER · 系統排名與用戶次序並列，排除不刪新聞或改模型分數。</title><rect x="400" y="1390" width="280" height="112" rx="12" fill="#fff" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1450">REVIEW SOURCES + USER ORDER</tspan></text></g><g data-node-id="gate" aria-label="COVERAGE → CONTEXT → LLM"><title>COVERAGE → CONTEXT → LLM · 核對所選 ID／次序，排除及裁剪後重查支持，再生成及驗證引用。</title><rect x="400" y="1600" width="280" height="112" rx="38" fill="#f1f3f4" stroke="#8b9ea2" stroke-width="1.6"></rect><text x="540" text-anchor="middle" fill="#082c38" font-size="14" font-weight="600" pointer-events="none"><tspan x="540" y="1660">COVERAGE → CONTEXT → LLM</tspan></text></g><text x="36" y="1758" font-size="11" fill="#536b72">教學設計 · 重試保留剩餘處理預算及計數 · 覆核等待另設絕對期限</text></svg>
